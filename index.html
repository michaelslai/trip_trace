<script>


/* =========================================================
   全域變數
========================================================= */


let currentLat = null;

let currentLng = null;

let currentAccuracy = null;


let currentMarker = null;

let pathLayer = null;

let recordMarkers = [];



/* =========================================================
   V3 新增：產生唯一 ID
========================================================= */


/*
  V2 使用：

  Date.now()

  V3 優先使用：

  crypto.randomUUID()

  可以避免快速連續新增時
  出現相同 ID。

  如果舊版瀏覽器不支援 UUID，
  才退回 Date.now + random。
*/

function generateRecordId() {


  if (
    window.crypto &&
    typeof crypto.randomUUID === "function"
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)

  );

}



/* =========================================================
   時區
========================================================= */


function getCurrentTimeZone() {


  try {

    return Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone || "UTC";

  }

  catch {

    return "UTC";

  }

}



function getGMTOffset(
  date = new Date()
) {


  const offsetMinutes =
    -date.getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const absoluteMinutes =
    Math.abs(
      offsetMinutes
    );


  const hours =
    Math.floor(
      absoluteMinutes / 60
    );


  const minutes =
    absoluteMinutes % 60;


  if (
    minutes === 0
  ) {

    return (
      "GMT" +
      sign +
      hours
    );

  }


  return (

    "GMT" +
    sign +
    hours +
    ":" +
    String(minutes)
      .padStart(2, "0")

  );

}



function getUTCOffsetMinutes() {

  return (
    -new Date()
      .getTimezoneOffset()
  );

}



/* =========================================================
   現在時間
========================================================= */


function updateCurrentTimeDisplay() {


  const now =
    new Date();


  const timeZone =
    getCurrentTimeZone();


  const gmt =
    getGMTOffset(
      now
    );


  document
    .getElementById(
      "currentTimeZone"
    )
    .textContent =
    timeZone;


  document
    .getElementById(
      "currentGMT"
    )
    .textContent =
    gmt;


  document
    .getElementById(
      "headerTimeZone"
    )
    .textContent =
    timeZone +
    " · " +
    gmt;


  document
    .getElementById(
      "currentLocalTime"
    )
    .textContent =
    now.toLocaleString(
      "zh-TW",
      {

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    );


  document
    .getElementById(
      "todayText"
    )
    .textContent =
    now.toLocaleDateString(
      "zh-TW",
      {

        year:
          "numeric",

        month:
          "long",

        day:
          "numeric",

        weekday:
          "long"

      }
    );

}



updateCurrentTimeDisplay();


setInterval(
  updateCurrentTimeDisplay,
  1000
);



/* =========================================================
   地圖
========================================================= */


const map =
  L.map(
    "map"
  )
  .setView(
    [
      35.6812,
      139.7671
    ],
    5
  );



L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:
      19,

    attribution:
      "© OpenStreetMap"

  }

).addTo(map);



/* =========================================================
   localStorage
========================================================= */


function getRecords() {


  const data =
    localStorage.getItem(
      "travelFootprints"
    );


  if (!data) {

    return [];

  }


  try {


    const records =
      JSON.parse(
        data
      );


    return Array.isArray(records)
      ? records
      : [];


  }

  catch {

    return [];

  }

}



function saveRecords(
  records
) {


  localStorage.setItem(

    "travelFootprints",

    JSON.stringify(
      records
    )

  );

}



/* =========================================================
   GPS
========================================================= */


function getCurrentLocation() {


  const status =
    document.getElementById(
      "gpsStatus"
    );


  if (
    !navigator.geolocation
  ) {


    status.textContent =
      "❌ 此瀏覽器不支援 GPS 定位。";


    return;

  }



  status.textContent =
    "📡 正在取得 GPS 位置...";



  navigator
    .geolocation
    .getCurrentPosition(


      function(position) {


        currentLat =
          position
            .coords
            .latitude;


        currentLng =
          position
            .coords
            .longitude;


        currentAccuracy =
          position
            .coords
            .accuracy;



        document
          .getElementById(
            "lat"
          )
          .textContent =
          currentLat
            .toFixed(6);



        document
          .getElementById(
            "lng"
          )
          .textContent =
          currentLng
            .toFixed(6);



        document
          .getElementById(
            "accuracy"
          )
          .textContent =
          "±" +
          Math.round(
            currentAccuracy
          ) +
          " 公尺";



        status.textContent =
          "✅ GPS 定位成功";



        if (
          currentMarker
        ) {

          map.removeLayer(
            currentMarker
          );

        }



        currentMarker =
          L.marker(
            [
              currentLat,
              currentLng
            ]
          )
          .addTo(map)
          .bindPopup(
            "📍 目前位置"
          )
          .openPopup();



        map.setView(
          [
            currentLat,
            currentLng
          ],
          16
        );



        autoDetectPlaceName(
          currentLat,
          currentLng
        );


      },



      function(error) {


        console.error(
          error
        );


        switch (
          error.code
        ) {


          case error
            .PERMISSION_DENIED:


            status.textContent =
              "❌ 定位權限被拒絕，請允許 Safari 使用位置。";

            break;



          case error
            .POSITION_UNAVAILABLE:


            status.textContent =
              "❌ 無法取得目前位置。";

            break;



          case error
            .TIMEOUT:


            status.textContent =
              "❌ GPS 定位逾時，請再試一次。";

            break;



          default:


            status.textContent =

        }


      },



      {

          true,

        timeout:
          20000,

        maximumAge:
          0

      }


    );

}

/* =========================================================
   距離
========================================================= */


function calculateDistanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {


  const R =
    6371;


  const toRad =
    value =>
      value *
      Math.PI /
      180;



  const dLat =
    toRad(
      lat2 - lat1
    );


  const dLon =
    toRad(
      lon2 - lon1
    );



  const a =

    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;



  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );



  return (
    R * c
  );

}



/* =========================================================
   V3 新增：重複紀錄檢查
========================================================= */


/*
  條件：

  最近一筆資料距離目前位置
  小於 30 公尺

  而且

  距離上一筆紀錄
  不超過 60 秒

  就跳出提醒。

  使用者仍可以選擇
  「確定」繼續新增。
*/

function checkDuplicateRecord(
  newLat,
  newLng,
  newTime
) {


  const records =
    getRecords();


  if (
    records.length === 0
  ) {

    return false;

  }



  const sorted =
    [...records]
      .sort(

        (a, b) =>

          new Date(
            a.timestamp
          ) -

          new Date(
            b.timestamp
          )

      );



  const last =
    sorted[
      sorted.length - 1
    ];



  const lastTime =
    new Date(
      last.timestamp
    );


  const diffSeconds =

    Math.abs(
      newTime - lastTime
    ) /
    1000;



  const distanceKm =
    calculateDistanceKm(

      Number(
        last.latitude
      ),

      Number(
        last.longitude
      ),

      Number(
        newLat
      ),

      Number(
        newLng
      )

    );



  const distanceMeters =
    distanceKm *
    1000;



  if (
    diffSeconds <= 60 &&
    distanceMeters <= 30
  ) {


    return {

      record:
        last,

      seconds:
        Math.round(
          diffSeconds
        ),

      meters:
        Math.round(
          distanceMeters
        )

    };

  }



  return false;

}

/* =========================================================
   日期時間格式
========================================================= */


function formatDateTimeForZone(
  date,
  timeZone
) {


  try {


    return date
      .toLocaleString(

        "zh-TW",

        {

          timeZone:
            timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }

      );


  }

  catch {


    return date
      .toLocaleString(
        "zh-TW",
        {
          hour12:
            false
        }
      );


  }

}



function formatRecordTime(
  record
) {


  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  try {


    return date
      .toLocaleTimeString(

        "zh-TW",

        {

          timeZone:
            timeZone,

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false

        }

      );


  }

  catch {


    return date
      .toLocaleTimeString(
        "zh-TW",
        {

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false

        }
      );


  }

}



/* =========================================================
   日期 Key
========================================================= */


function getRecordDateKey(
  record
) {


  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  try {


    const parts =
      new Intl
        .DateTimeFormat(
          "en-CA",
          {

            timeZone:
              timeZone,

            year:
              "numeric",

            month:
              "2-digit",

            day:
              "2-digit"

          }
        )
        .formatToParts(
          date
        );


    const values =
      {};


    parts.forEach(
      part => {

        values[
          part.type
        ] =
        part.value;

      }
    );


    return (

      values.year +
      "-" +
      values.month +
      "-" +
      values.day

    );


  }

  catch {


    return date
      .toISOString()
      .slice(
        0,
        10
      );


  }

}

}



/* =========================================================
   分組
========================================================= */


function groupRecordsByDay(
  records
) {


  const groups =
    {};



  records.forEach(
    record => {


      const key =
        getRecordDateKey(
          record
        );


      if (
        !groups[key]
      ) {

        groups[key] =
          [];

      }


      groups[key]
        .push(
          record
        );


    }
  );



  return groups;

}



/* =========================================================
   群組距離
========================================================= */


function calculateGroupDistance(
  records
) {


  let total =
    0;


  for (
    let i = 1;
    i < records.length;
    i++
  ) {


    const previous =
      records[
        i - 1
      ];


    const current =
      records[
        i
      ];



    const distance =
      calculateDistanceKm(

        Number(
          previous.latitude
        ),

        Number(
          previous.longitude
        ),

        Number(
          current.latitude
        ),

        Number(
          current.longitude
        )

      );


    if (
      Number.isFinite(
        distance
      )
    ) {

      total +=
        distance;

    }

  }



  return total;

}



/* =========================================================
   格式化距離
========================================================= */


function formatDistance(
  km
) {


  if (
    km < 1
  ) {


    return (
      Math.round(
        km * 1000
      ) +
      " m"
    );

  }


  if (
    km < 10
  ) {


    return (
      km.toFixed(2) +
      " km"
    );

  }


  return (
    km.toFixed(1) +
    " km"
  );

}

            b.timestamp
          )

    groupRecordsByDay(
      sorted
    );

    Object.keys(

    )
    .sort();

    [];

    1;

      dayRecords.forEach(

            );

              record
            );

            getRecordGMT(

            );

                Number(

                )

                record.longitude
              ).toFixed(6)}

                )}

                  record.note
                )}

            }

            );

              ]
            )

            .bindPopup(

              <b>

                ${escapeHTML(
                  record.place
                )}

              </b>

              <br>

              ${dateKey}
              ${time}

              <br>

              🕐
              ${escapeHTML(

              )}

            );



          recordMarkers.push(
            marker
          );



          path.push(

                record.latitude
              ),

                record.longitude
              )
            ]
          );

      );

function updateStats(
  records
) {


  document
    .getElementById(
      "recordCount"
    )
    .textContent =
    records.length;



  if (
    records.length === 0
  ) {


    document
      .getElementById(
        "dayCount"
      )
      .textContent =
      "0";


    document
      .getElementById(
        "totalDistance"
      )
      .textContent =
      "0 km";


    return;

  }



  const groups =
    groupRecordsByDay(
      records
    );


  document
    .getElementById(
      "dayCount"
    )
    .textContent =
    Object.keys(
      groups
    )
    .length;



  let totalDistance =
    0;


  Object.values(
    groups
  )
  .forEach(
    dayRecords => {


      totalDistance +=
        calculateGroupDistance(
          dayRecords
        );


    }
  );



  document
    .getElementById(
      "totalDistance"
    )
    .textContent =
    formatDistance(
      totalDistance
    );

}



/* =========================================================
   V3 修改：單筆刪除
========================================================= */


/*
  V2：

  item.id !== id

  如果舊資料的 ID 是 number，
  新資料 ID 是 string，
  有可能比較失敗。

  V3：

  一律 String(item.id)
  跟 String(id) 比較。
*/

function deleteRecord(
  id
) {


  const records =
    getRecords();



  const target =
    records.find(

      item =>
        String(
          item.id
        ) ===
        String(
          id
        )

    );



  if (!target) {


    alert(
      "找不到這筆紀錄，請重新整理頁面後再試一次。"
    );


    return;

  }



  const ok =
    confirm(

      "確定要刪除這筆足跡嗎？\n\n" +

      "📍 " +
      (
        target.place ||
        "未命名地點"
      ) +

      "\n" +

      formatRecordTime(
        target
      )

    );



  if (!ok) {

    return;

  }



  const newRecords =
    records.filter(

      item =>
        String(
          item.id
        ) !==
        String(
          id
        )

    );



  saveRecords(
    newRecords
  );


  renderRecords();



  alert(

    "✅ 已刪除足跡\n\n" +

    (
      target.place ||
      "未命名地點"
    )

  );

}

/* =========================================================

function getEditableDateTimeParts(
  record
) {


  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();



  const formatter =
    new Intl.DateTimeFormat(

      "en-CA",

      {

        timeZone:
          timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }

    );



  const parts =
    formatter
      .formatToParts(
        date
      );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );



  return {


    date:

      values.year +
      "-" +
      values.month +
      "-" +
      values.day,


    time:

      values.hour +
      ":" +
      values.minute +
      ":" +
      values.second

/* =========================================================
   V3 新增：將當地日期時間轉 UTC
========================================================= */


/*
  編輯時間時，
  使用者輸入的是「當地時間」。

  例如：

  2026-09-18
  13:05:00

  Asia/Tokyo

  必須轉回正確 UTC timestamp，
  才能維持資料排序正確。
*/

function localDateTimeToUTC(
  dateText,
  timeText,
  timeZone
) {


  const [
    year,
    month,
    day
  ] =
  dateText
    .split("-")
    .map(Number);



  const [
    hour,
    minute,
    second = 0
  ] =
  timeText
    .split(":")
    .map(Number);



  /*
    先建立一個暫時 UTC 日期
  */

  const guess =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      )
    );



  /*
    透過 Intl 判斷
    在指定時區顯示時的差異
  */

  const formatter =
    new Intl.DateTimeFormat(

      "en-US",

      {

        timeZone:
          timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }

    );



  const parts =
    formatter
      .formatToParts(
        guess
      );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );



  const displayedAsUTC =
    Date.UTC(

      Number(values.year),

      Number(values.month) - 1,

      Number(values.day),

      Number(values.hour),

      Number(values.minute),

      Number(values.second)

    );



  const desiredAsUTC =
    Date.UTC(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    );



  const difference =
    desiredAsUTC -
    displayedAsUTC;



  return new Date(
    guess.getTime() +
    difference
  );

}



/* =========================================================
   V3 新增：儲存修改
========================================================= */


function saveEditedRecord() {


  const id =
    document
      .getElementById(
        "editRecordId"
      )
      .value;



  const place =
    document
      .getElementById(
        "editPlace"
      )
      .value
      .trim();



  const note =
    document
      .getElementById(
        "editNote"
      )
      .value
      .trim();



  const dateText =
    document
      .getElementById(
        "editDate"
      )
      .value;



  const timeText =
    document
      .getElementById(
        "editTime"
      )
      .value;



  if (
    !dateText ||
    !timeText
  ) {


    alert(
      "請輸入日期與時間。"
    );


    return;

  }



  const records =
    getRecords();



  const index =
    records.findIndex(

      item =>
        String(
          item.id
        ) ===
        String(
          id
        )

    );



  if (
    index === -1
  ) {


    alert(
      "找不到要修改的紀錄。"
    );


    return;

  }



  const record =
    records[
      index
    ];



  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();



  const newDate =
    localDateTimeToUTC(

      dateText,

      timeText,

      timeZone

    );



  /*
    V3 修改：

    GPS 座標不變。

    只修改：

    地點名稱
    日期
    時間
    備註
  */

  record.place =
    place ||
    "未命名地點";


  record.note =
    note;


  record.timestamp =
    newDate.toISOString();


  record.localTime =
    formatDateTimeForZone(

      newDate,

      timeZone

    );



  records[
    index
  ] =
  record;



  saveRecords(
    records
  );


  closeEditModal();


  renderRecords();



  alert(
    "✅ 足跡已修改"
  );

}

/* =========================================================
   CSV 匯出
========================================================= */


function exportCSV() {


  const records =
    getRecords();


  if (
    records.length === 0
  ) {


    alert(
      "目前沒有紀錄。"
    );


    return;

  }



  const sorted =
    [...records]
      .sort(

        (a, b) =>

          new Date(
            a.timestamp
          ) -

          new Date(
            b.timestamp
          )

      );



  const rows = [

    [

      "當地日期",

      "當地時間",

      "地點",

      "時區",

      "GMT",

      "UTC時間",

      "緯度",

      "經度",

      "GPS精度",

      "備註",

      "ID"

    ]

  ];



  sorted.forEach(
    record => {


      rows.push([


        getRecordDateKey(
          record
        ),


        formatRecordTime(
          record
        ),


        record.place,


        record.timeZone ||
        "",


        record.gmtOffset ||
        "",


        record.timestamp,


        record.latitude,


        record.longitude,


        record.accuracy,


        record.note,


        record.id


      ]);


    }
  );



  const csv =

    "\uFEFF" +

    rows

      .map(

        row =>

          row

            .map(
              csvEscape
            )

            .join(",")

      )

      .join("\n");



  downloadFile(

    csv,

    "travel-footprints.csv",

    "text/csv;charset=utf-8"

  );

}



/* =========================================================
   JSON 匯出
========================================================= */


function exportJSON() {


  const records =
    getRecords();


  if (
    records.length === 0
  ) {


    alert(
      "目前沒有紀錄。"
    );


    return;

  }



  /*
    V3 修改：

    JSON 最外層加入版本資訊。

    舊版只有 array。

    匯入功能兩種格式都支援。
  */

  const backup = {


    version:
      3,


    exportedAt:
      new Date()
        .toISOString(),


    records:
      records


  };



  const data =
    JSON.stringify(

      backup,

      null,

      2

    );



  downloadFile(

    data,

    "travel-footprints-v3.json",

    "application/json"

  );

}



/* =========================================================
   V3 新增：JSON 匯入還原
========================================================= */


function importJSON(
  event
) {


  const file =
    event.target.files[
      0
    ];


  if (!file) {

    return;

  }



  const reader =
    new FileReader();



  reader.onload =
    function(e) {


      try {


        const data =
          JSON.parse(
            e.target.result
          );



        /*
          支援兩種格式：

          舊版：
          [ ... records ... ]

          V3：
          {
            version: 3,
            records: [...]
          }
        */

        let importedRecords =
          null;



        if (
          Array.isArray(
            data
          )
        ) {


          importedRecords =
            data;


        }

        else if (
          data &&
          Array.isArray(
            data.records
          )
        ) {


          importedRecords =
            data.records;


        }



        if (
          !importedRecords
        ) {


          throw new Error(
            "JSON 格式不是足跡備份格式。"
          );

        }



        /*
          基本資料檢查
        */

        const valid =
          importedRecords
            .every(
              record =>

                record &&
                record.timestamp &&
                record.latitude !== undefined &&
                record.longitude !== undefined

            );



        if (!valid) {


          throw new Error(
            "備份內含無效足跡資料。"
          );

        }



        /*
          舊資料可能沒有 ID。

          如果沒有，
          V3 自動補 UUID。
        */

        importedRecords =
          importedRecords
            .map(
              record => {


                if (
                  record.id === undefined ||
                  record.id === null ||
                  record.id === ""
                ) {


                  record.id =
                    generateRecordId();


                }


                return record;


              }
            );



        const ok =
          confirm(

            "找到 " +

            importedRecords.length +

            " 筆足跡。\n\n" +

            "匯入後會取代目前手機上的所有紀錄。\n\n" +

            "確定要繼續嗎？"

          );



        if (!ok) {

          return;

        }



        saveRecords(
          importedRecords
        );


        renderRecords();



        alert(

          "✅ 備份還原完成\n\n" +

          importedRecords.length +

          " 筆足跡已匯入。"

        );


      }

      catch (error) {


        console.error(
          error
        );


        alert(

          "❌ JSON 匯入失敗\n\n" +

          error.message

        );


      }

      finally {


        /*
          清空 input。

          這樣下一次即使選同一個檔案，
          onchange 仍然會觸發。
        */

        event.target.value =
          "";


      }


    };



  reader.readAsText(
    file
  );

}



/* =========================================================
   下載
========================================================= */


function downloadFile(
  content,
  filename,
  type
) {


  const blob =
    new Blob(

      [content],

      {
        type:
          type
      }

    );



  const url =
    URL.createObjectURL(
      blob
    );



  const a =
    document
      .createElement(
        "a"
      );


  a.href =
    url;


  a.download =
    filename;



  document.body
    .appendChild(
      a
    );


  a.click();


  document.body
    .removeChild(
      a
    );



  setTimeout(

    () => {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );

}



/* =========================================================
   CSV Escape
========================================================= */


function csvEscape(
  value
) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }



  const str =
    String(
      value
    );



  if (

    str.includes(",") ||

    str.includes('"') ||

    str.includes("\n")

  ) {


    return (

      '"' +

      str.replace(
        /"/g,
        '""'
      ) +

      '"'

    );

  }



  return str;

}



/* =========================================================
   HTML Escape
========================================================= */


function escapeHTML(
  text
) {


  const div =
    document
      .createElement(
        "div"
      );


  div.textContent =
    text || "";


  return div.innerHTML;

}
