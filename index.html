<!-- Leaflet JS -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script>

/* =========================================
   全域變數
========================================= */


let currentLat = null;

let currentLng = null;

let currentAccuracy = null;


let currentMarker = null;

let pathLayer = null;

let recordMarkers = [];



/* =========================================
   時區功能
========================================= */


/*
  取得目前手機 / 瀏覽器時區

  台灣：
  Asia/Taipei

  日本：
  Asia/Tokyo
*/

function getCurrentTimeZone() {

  try {

    return Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone || "UTC";

  }

  catch {

    return "UTC";

  }

}



/*
  取得 GMT Offset

  台灣：
  GMT+8

  日本：
  GMT+9
*/

function getGMTOffset(date = new Date()) {

  const offsetMinutes =
    -date.getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const absoluteMinutes =
    Math.abs(offsetMinutes);


  const hours =
    Math.floor(
      absoluteMinutes / 60
    );


  const minutes =
    absoluteMinutes % 60;


  if (minutes === 0) {

    return "GMT" +
      sign +
      hours;

  }


  return "GMT" +
    sign +
    hours +
    ":" +
    String(minutes)
      .padStart(2, "0");

}



/*
  儲存 offset 分鐘

  台灣 = 480
  日本 = 540
*/

function getUTCOffsetMinutes() {

  return -new Date()
    .getTimezoneOffset();

}



/*
  更新頁面目前時間
*/

function updateCurrentTimeDisplay() {

  const now =
    new Date();


  const timeZone =
    getCurrentTimeZone();


  const gmt =
    getGMTOffset(now);


  document
    .getElementById(
      "currentTimeZone"
    )
    .textContent =
    timeZone;


  document
    .getElementById(
      "currentGMT"
    )
    .textContent =
    gmt;


  document
    .getElementById(
      "headerTimeZone"
    )
    .textContent =
    timeZone +
    " · " +
    gmt;


  document
    .getElementById(
      "currentLocalTime"
    )
    .textContent =
    now.toLocaleString(
      "zh-TW",
      {
        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false
      }
    );


  document
    .getElementById(
      "todayText"
    )
    .textContent =
    now.toLocaleDateString(
      "zh-TW",
      {
        year:
          "numeric",

        month:
          "long",

        day:
          "numeric",

        weekday:
          "long"
      }
    );

}



/*
  每秒更新目前時間

  如果 iPhone 在旅行途中
  自動切換時區，
  網頁重新開啟或重新整理後
  就會取得新的時區。
*/

updateCurrentTimeDisplay();


setInterval(
  updateCurrentTimeDisplay,
  1000
);



/* =========================================
   地圖
========================================= */


const map =
  L.map(
    "map"
  )
  .setView(
    [
      35.6812,
      139.7671
    ],
    5
  );



L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:
      19,

    attribution:
      "© OpenStreetMap"

  }

).addTo(map);



/* =========================================
   localStorage
========================================= */


function getRecords() {

  const data =
    localStorage.getItem(
      "travelFootprints"
    );


  if (!data) {

    return [];

  }


  try {

    return JSON.parse(data);

  }

  catch {

    return [];

  }

}



function saveRecords(records) {

  localStorage.setItem(

    "travelFootprints",

    JSON.stringify(records)

  );

}



/* =========================================
   GPS
========================================= */


function getCurrentLocation() {


  const status =
    document.getElementById(
      "gpsStatus"
    );


  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "❌ 此瀏覽器不支援 GPS 定位。";

    return;

  }


  status.textContent =
    "📡 正在取得 GPS 位置...";



  navigator
    .geolocation
    .getCurrentPosition(


      function(position) {


        currentLat =
          position
            .coords
            .latitude;


        currentLng =
          position
            .coords
            .longitude;


        currentAccuracy =
          position
            .coords
            .accuracy;



        document
          .getElementById(
            "lat"
          )
          .textContent =
          currentLat
            .toFixed(6);



        document
          .getElementById(
            "lng"
          )
          .textContent =
          currentLng
            .toFixed(6);



        document
          .getElementById(
            "accuracy"
          )
          .textContent =
          "±" +
          Math.round(
            currentAccuracy
          ) +
          " 公尺";



        status.textContent =
          "✅ GPS 定位成功";



        if (
          currentMarker
        ) {

          map.removeLayer(
            currentMarker
          );

        }



        currentMarker =
          L.marker(
            [
              currentLat,
              currentLng
            ]
          )
          .addTo(map)
          .bindPopup(
            "📍 目前位置"
          )
          .openPopup();



        map.setView(
          [
            currentLat,
            currentLng
          ],
          16
        );



        autoDetectPlaceName(
          currentLat,
          currentLng
        );

      },



      function(error) {


        console.error(
          error
        );


        switch (
          error.code
        ) {


          case error
            .PERMISSION_DENIED:


            status.textContent =
              "❌ 定位權限被拒絕，請允許 Safari 使用位置。";

            break;



          case error
            .POSITION_UNAVAILABLE:


            status.textContent =
              "❌ 無法取得目前位置。";

            break;



          case error
            .TIMEOUT:


            status.textContent =
              "❌ GPS 定位逾時，請再試一次。";

            break;



          default:


            status.textContent =
              "❌ GPS 定位失敗。";


        }

      },



      {

        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          0

      }


    );

}



/* =========================================
   自動取得地點名稱
   OpenStreetMap Nominatim
========================================= */


async function autoDetectPlaceName(
  lat,
  lng
) {


  const input =
    document.getElementById(
      "placeName"
    );


  input.placeholder =
    "正在判斷目前地點...";


  try {


    const url =

      "https://nominatim.openstreetmap.org/reverse" +

      "?format=jsonv2" +

      "&lat=" +
      encodeURIComponent(lat) +

      "&lon=" +
      encodeURIComponent(lng) +

      "&accept-language=zh-TW,zh,en";



    const response =
      await fetch(url);



    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }



    const data =
      await response.json();



    const address =
      data.address || {};



    const name =

      data.name ||

      address.attraction ||

      address.tourism ||

      address.station ||

      address.railway ||

      address.shop ||

      address.amenity ||

      address.hotel ||

      address.building ||

      address.neighbourhood ||

      address.suburb ||

      address.quarter ||

      address.city_district ||

      address.city ||

      address.town ||

      address.village ||

      "";



    if (name) {

      input.value =
        name;

    }



    input.placeholder =
      "例如：桃園機場、福岡機場、博多車站";


  }

  catch (error) {


    console.log(
      "Reverse geocoding error:",
      error
    );


    input.placeholder =
      "無法自動取得地名，請自行輸入";


  }

}



/* =========================================
   紀錄位置
========================================= */


function saveLocation() {


  if (
    currentLat === null ||
    currentLng === null
  ) {

    alert(
      "請先按「取得目前 GPS」。"
    );

    return;

  }



  const placeName =
    document
      .getElementById(
        "placeName"
      )
      .value
      .trim();



  const note =
    document
      .getElementById(
        "note"
      )
      .value
      .trim();



  const recordTime =
    new Date();



  /*
    這兩個值非常重要：

    timeZone
    儲存紀錄當下的時區名稱

    utcOffsetMinutes
    儲存紀錄當下與 UTC
    相差幾分鐘
  */


  const timeZone =
    getCurrentTimeZone();


  const gmtOffset =
    getGMTOffset(
      recordTime
    );


  const utcOffsetMinutes =
    getUTCOffsetMinutes();



  const record = {


    id:
      Date.now(),


    latitude:
      currentLat,


    longitude:
      currentLng,


    accuracy:
      currentAccuracy,


    place:
      placeName ||
      "未命名地點",


    note:
      note,


    /*
      UTC 標準時間

      永遠保留，
      方便以後計算旅行時間
    */

    timestamp:
      recordTime
        .toISOString(),


    /*
      紀錄當下時區
    */

    timeZone:
      timeZone,


    /*
      例如：
      GMT+8
      GMT+9
    */

    gmtOffset:
      gmtOffset,


    /*
      台灣 480
      日本 540
    */

    utcOffsetMinutes:
      utcOffsetMinutes,


    /*
      儲存「當下看到的當地時間」

      例如：

      台灣
      2026/09/18 07:20:15

      日本
      2026/09/18 11:45:32
    */

    localTime:
      formatDateTimeForZone(
        recordTime,
        timeZone
      )


  };



  const records =
    getRecords();


  records.push(
    record
  );


  saveRecords(
    records
  );



  document
    .getElementById(
      "note"
    )
    .value =
    "";



  renderRecords();



  alert(

    "✅ 足跡已紀錄\n\n" +

    record.place +

    "\n" +

    record.localTime +

    "\n" +

    record.timeZone +

    " · " +

    record.gmtOffset

  );

}



/* =========================================
   日期格式
========================================= */


/*
  指定時區格式化完整時間
*/

function formatDateTimeForZone(
  date,
  timeZone
) {


  try {


    return date
      .toLocaleString(

        "zh-TW",

        {

          timeZone:
            timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }

      );


  }

  catch {


    return date
      .toLocaleString(
        "zh-TW",
        {
          hour12:
            false
        }
      );


  }

}



/*
  顯示每一筆紀錄時間

  優先使用該紀錄自己保存的時區
*/

function formatRecordTime(
  record
) {


  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  try {


    return date
      .toLocaleTimeString(

        "zh-TW",

        {

          timeZone:
            timeZone,

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false

        }

      );


  }

  catch {


    return date
      .toLocaleTimeString(

        "zh-TW",

        {

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false

        }

      );


  }

}



/*
  顯示每一筆紀錄日期
*/

function formatRecordDate(
  record
) {


  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  try {


    return date
      .toLocaleDateString(

        "zh-TW",

        {

          timeZone:
            timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit"

        }

      );


  }

  catch {


    return date
      .toLocaleDateString(
        "zh-TW"
      );


  }

}



/* =========================================
   舊資料相容
========================================= */


/*
  舊版紀錄沒有：

  timeZone
  gmtOffset
  utcOffsetMinutes

  所以這裡提供預設顯示方式。

  注意：
  舊紀錄本來沒有保存時區，
  因此無法百分之百知道
  當時是在台灣還是日本。

  新增的紀錄就不會有這個問題。
*/

function getRecordTimeZone(
  record
) {

  return (
    record.timeZone ||
    "舊版紀錄"
  );

}



function getRecordGMT(
  record
) {

  if (
    record.gmtOffset
  ) {

    return record.gmtOffset;

  }


  return "";

}



/* =========================================
   顯示紀錄
========================================= */


function renderRecords() {


  const records =
    getRecords();


  const list =
    document
      .getElementById(
        "recordList"
      );


  list.innerHTML =
    "";



  /*
    清除舊 marker
  */

  recordMarkers
    .forEach(

      marker =>

        map.removeLayer(
          marker
        )

    );


  recordMarkers =
    [];



  /*
    清除路線
  */

  if (
    pathLayer
  ) {

    map.removeLayer(
      pathLayer
    );

    pathLayer =
      null;

  }



  if (
    records.length === 0
  ) {


    list.innerHTML =
      '<div class="empty">' +
      '尚未紀錄任何足跡' +
      '</div>';


    updateStats(
      []
    );


    return;

  }



  /*
    按 UTC 時間排序
  */

  const sorted =
    [...records]
      .sort(

        (a, b) =>

          new Date(
            a.timestamp
          ) -

          new Date(
            b.timestamp
          )

      );



  const path =
    [];



  sorted.forEach(

    (record, index) => {


      const time =
        formatRecordTime(
          record
        );


      const date =
        formatRecordDate(
          record
        );


      const zone =
        getRecordTimeZone(
          record
        );


      const gmt =
        getRecordGMT(
          record
        );



      const timezoneText =

        gmt

        ?

        zone +
        " · " +
        gmt

        :

        zone;



      const div =
        document
          .createElement(
            "div"
          );


      div.className =
        "record";



      div.innerHTML = `

        <div class="record-top">

          <div>

            <div class="record-time">

              ${time}

            </div>


            <div class="record-place">

              📍
              ${escapeHTML(record.place)}

            </div>

          </div>



          <button

            class="delete-btn"

            onclick="deleteRecord(${record.id})">

            刪除

          </button>

        </div>



        <div class="record-detail">

          📅
          ${date}

          <br>

          GPS：
          ${Number(record.latitude).toFixed(6)},
          ${Number(record.longitude).toFixed(6)}

          <br>

          精度：
          ±${Math.round(record.accuracy || 0)}
          公尺

          <br>

          <span class="record-timezone">

            🕐
            ${escapeHTML(timezoneText)}

          </span>

        </div>



        ${
          record.note

          ?

          `

          <div class="record-note">

            📝
            ${escapeHTML(record.note)}

          </div>

          `

          :

          ""

        }

      `;



      list.appendChild(
        div
      );



      const marker =
        L.marker(
          [
            record.latitude,
            record.longitude
          ]
        )
        .addTo(map)
        .bindPopup(

          `

          <b>

            ${index + 1}.
            ${escapeHTML(record.place)}

          </b>

          <br>

          ${date}
          ${time}

          <br>

          🕐
          ${escapeHTML(timezoneText)}

          `

        );



      recordMarkers.push(
        marker
      );



      path.push(
        [
          record.latitude,
          record.longitude
        ]
      );


    }

  );



  /*
    畫出移動路線
  */

  if (
    path.length >= 2
  ) {


    pathLayer =
      L.polyline(

        path,

        {

          weight:
            4,

          opacity:
            0.7

        }

      )
      .addTo(map);


  }



  /*
    地圖自動縮放到
    所有足跡
  */

  if (
    path.length > 0
  ) {


    const bounds =
      L.latLngBounds(
        path
      );


    map.fitBounds(

      bounds,

      {

        padding:
          [30, 30],

        maxZoom:
          16

      }

    );


  }



  updateStats(
    sorted
  );

}



/* =========================================
   統計
========================================= */


function updateStats(
  records
) {


  document
    .getElementById(
      "recordCount"
    )
    .textContent =
    records.length;



  if (
    records.length === 0
  ) {


    document
      .getElementById(
        "firstTime"
      )
      .textContent =
      "--";


    document
      .getElementById(
        "lastTime"
      )
      .textContent =
      "--";


    return;

  }



  document
    .getElementById(
      "firstTime"
    )
    .textContent =
    formatRecordTime(
      records[0]
    );



  document
    .getElementById(
      "lastTime"
    )
    .textContent =
    formatRecordTime(

      records[
        records.length - 1
      ]

    );

}



/* =========================================
   刪除單筆
========================================= */


function deleteRecord(
  id
) {


  const confirmDelete =
    confirm(
      "確定要刪除這筆足跡嗎？"
    );


  if (
    !confirmDelete
  ) {

    return;

  }



  let records =
    getRecords();



  records =
    records.filter(

      item =>
        item.id !== id

    );



  saveRecords(
    records
  );


  renderRecords();

}



/* =========================================
   清除全部
========================================= */


function clearAllRecords() {


  const ok =
    confirm(

      "⚠️ 確定要清除全部足跡？\n\n" +

      "此操作無法復原。"

    );


  if (!ok) {

    return;

  }



  localStorage
    .removeItem(
      "travelFootprints"
    );


  renderRecords();

}



/* =========================================
   CSV
========================================= */


function exportCSV() {


  const records =
    getRecords();


  if (
    records.length === 0
  ) {


    alert(
      "目前沒有紀錄。"
    );


    return;

  }



  const rows = [

    [

      "當地日期時間",

      "時區",

      "GMT",

      "UTC Offset 分鐘",

      "UTC時間",

      "地點",

      "緯度",

      "經度",

      "GPS精度",

      "備註"

    ]

  ];



  records.forEach(

    record => {


      rows.push([


        record.localTime ||
        formatDateTimeForZone(

          new Date(
            record.timestamp
          ),

          record.timeZone ||
          getCurrentTimeZone()

        ),


        record.timeZone ||
        "",


        record.gmtOffset ||
        "",


        record.utcOffsetMinutes ??
        "",


        record.timestamp,


        record.place,


        record.latitude,


        record.longitude,


        record.accuracy,


        record.note


      ]);


    }

  );



  const csv =

    "\uFEFF" +

    rows

      .map(

        row =>

          row

            .map(
              csvEscape
            )

            .join(",")

      )

      .join("\n");



  downloadFile(

    csv,

    "travel-footprints.csv",

    "text/csv;charset=utf-8"

  );

}



/* =========================================
   JSON
========================================= */


function exportJSON() {


  const records =
    getRecords();


  if (
    records.length === 0
  ) {


    alert(
      "目前沒有紀錄。"
    );


    return;

  }



  const data =
    JSON.stringify(

      records,

      null,

      2

    );



  downloadFile(

    data,

    "travel-footprints.json",

    "application/json"

  );

}



/* =========================================
   下載
========================================= */


function downloadFile(
  content,
  filename,
  type
) {


  const blob =
    new Blob(

      [content],

      {
        type:
          type
      }

    );



  const url =
    URL.createObjectURL(
      blob
    );



  const a =
    document
      .createElement(
        "a"
      );


  a.href =
    url;


  a.download =
    filename;



  document.body
    .appendChild(
      a
    );


  a.click();


  document.body
    .removeChild(
      a
    );



  setTimeout(

    () => {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );

}



/* =========================================
   CSV Escape
========================================= */


function csvEscape(
  value
) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }



  const str =
    String(
      value
    );



  if (

    str.includes(",") ||

    str.includes('"') ||

    str.includes("\n")

  ) {


    return (

      '"' +

      str.replace(
        /"/g,
        '""'
      ) +

      '"'

    );

  }



  return str;

}



/* =========================================
   HTML Escape
========================================= */


function escapeHTML(
  text
) {


  const div =
    document
      .createElement(
        "div"
      );


  div.textContent =
    text || "";


  return div.innerHTML;

}



/* =========================================
   啟動
========================================= */


renderRecords();


/*
  iPhone Safari
  從背景回到前景時，
  再更新一次時區。

  如果剛好跨國後
  iPhone 已切換時區，
  就能取得新的時區。
*/

document.addEventListener(

  "visibilitychange",

  function() {


    if (
      document.visibilityState ===
      "visible"
    ) {

      updateCurrentTimeDisplay();

    }

  }

);

</script>
