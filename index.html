<!DOCTYPE html>

<!--
=============================================================
  我的旅遊足跡 V4
=============================================================

【V4 新增 / 修改功能】

1. V4 新增：自製訊息 / 確認對話框
   - 移除主要操作中的 window.alert()
   - 移除主要操作中的 window.confirm()
   - 避免 iOS 顯示「禁止顯示對話方塊」
   - 新增、修改、刪除、重複提醒、清除資料、
     JSON 匯入確認皆使用自製 Modal
   - 成功訊息使用 Toast 提示，不阻擋操作

2. V4 新增：日期篩選功能
   - 可選擇「全部日期」
   - 可只查看指定日期的足跡
   - 足跡時間軸同步篩選
   - 地圖 Marker 同步篩選
   - 地圖路線同步只顯示所選日期
   - 統計區仍顯示整趟旅行總資料

3. V4 新增：地圖 Marker 與足跡列表連動
   - 點擊地圖 Marker
   - 自動捲動到對應的足跡紀錄
   - 對應紀錄會短暫高亮顯示

4. V4 新增：足跡點擊定位
   - 點擊足跡內容可讓地圖移動到該位置
   - 自動開啟該 Marker Popup

5. V4 改善：編輯 Modal
   - 延續 V3 編輯功能
   - 可修改地點、日期、時間、備註
   - GPS 座標維持不變
   - 修改完成改用 Toast 顯示結果

6. V4 改善：單筆刪除
   - 保留 V3 String ID 比對
   - 支援舊版 Date.now() 數字 ID
   - 支援 V3/V4 UUID
   - 改用自製確認視窗

7. V4 改善：重複紀錄防呆
   - 60 秒內
   - 距離 30 公尺內
   - 顯示自製確認視窗
   - 使用者仍可選擇強制新增

8. V4 改善：JSON 備份 / 還原
   - 支援 V2 Array JSON
   - 支援 V3 JSON
   - 支援 V4 JSON
   - 匯入前驗證資料格式
   - 匯入改用自製確認視窗
   - 匯出版本更新為 version: 4

9. 保留自動時區
   - Asia/Taipei · GMT+8
   - Asia/Tokyo · GMT+9
   - 每筆紀錄保存自己的時區

10. 保留日期分組
    - 每日足跡數量
    - 每日移動距離
    - 日期與星期

11. 保留距離統計
    - Haversine Formula
    - 前一站直線距離
    - 每日總距離
    - 整趟旅行總距離

12. 保留 GPS / 自動地名
    - navigator.geolocation
    - GPS 精度
    - OpenStreetMap Nominatim

13. 保留 Leaflet / OpenStreetMap 地圖

Storage Key : travelFootprints
Version     : V4
=============================================================
-->

<script>


/* =========================================================
   全域
========================================================= */

let currentLat = null;

let currentLng = null;

let currentAccuracy = null;

let currentMarker = null;

let pathLayer = null;

let recordMarkers = [];

let markerByRecordId =
  new Map();

let currentDateFilter =
  "all";

let toastTimer =
  null;


/* =========================================================
   ID
========================================================= */

function generateRecordId() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
    "function"
  ) {

    return crypto.randomUUID();

  }

  return (

    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)

  );

}


/* =========================================================
   V4 新增：Toast
========================================================= */

function showToast(
  message,
  duration = 2200
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast
          .classList

/* =========================================================
   時區
========================================================= */

function getCurrentTimeZone() {

  try {

    return Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone ||
      "UTC";

  }

  catch {

    return "UTC";

  }

}


function getGMTOffset(
  date = new Date()
) {

  const offsetMinutes =
    -date
      .getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const absoluteMinutes =
    Math.abs(
      offsetMinutes
    );


  const hours =
    Math.floor(
      absoluteMinutes / 60
    );


  const minutes =
    absoluteMinutes % 60;


  if (
    minutes === 0
  ) {

    return (
      "GMT" +
      sign +
      hours
    );

  }


  return (

    "GMT" +
    sign +
    hours +
    ":" +
    String(minutes)
      .padStart(2,"0")

  );

}


function getUTCOffsetMinutes() {

  return (
    -new Date()
      .getTimezoneOffset()
  );

}

function getCurrentLocation() {

    );


  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "❌ 此瀏覽器不支援 GPS 定位。";

    return;

  }


  status.textContent =
    "📡 正在取得 GPS 位置...";


  navigator
    .geolocation
    .getCurrentPosition(


      function(position) {

        currentLat =
          position.coords.latitude;


        currentLng =
          position.coords.longitude;


        currentAccuracy =
          position.coords.accuracy;


        document
          .getElementById(
            "lat"
          )
          .textContent =
          currentLat
            .toFixed(6);


        document
          .getElementById(
            "lng"
          )
          .textContent =

            .toFixed(6);


        document
          .getElementById(
            "accuracy"
          )
          .textContent =
          "±" +
          Math.round(
            currentAccuracy
          ) +
          " 公尺";


        status.textContent =
          "✅ GPS 定位成功";


        if (
          currentMarker
        ) {

          map.removeLayer(
            currentMarker
          );

        }


        currentMarker =
          L.marker(
            [
              currentLat,
              currentLng
            ]
          )
          .addTo(map)
          .bindPopup(
            "📍 目前位置"
          )
          .openPopup();


        map.setView(
          [
            currentLat,
            currentLng
          ],
          16
        );


        autoDetectPlaceName(
          currentLat,

        );

      },


      function(error) {

        console.error(
          error
        );


        switch (
          error.code
        ) {

          case error.PERMISSION_DENIED:

            status.textContent =
              "❌ 定位權限被拒絕。";

            break;


          case error.POSITION_UNAVAILABLE:

            status.textContent =
              "❌ 無法取得目前位置。";

            break;


          case error.TIMEOUT:

            status.textContent =
              "❌ GPS 定位逾時。";

            break;


          default:

            status.textContent =
              "❌ GPS 定位失敗。";

        }

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:

      }

async function autoDetectPlaceName(

) {

  const input =

  input.placeholder =
    "正在判斷目前地點...";


  try {

      "https://nominatim.openstreetmap.org/reverse" +

      "?format=jsonv2" +

      "&lat=" +
      encodeURIComponent(lat) +

      "&lon=" +
      encodeURIComponent(lng) +

      "&accept-language=zh-TW,zh,en";


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    const address =
      data.address ||
      {};


    const name =

      data.name ||

      address.attraction ||

      address.tourism ||

      address.station ||

      address.railway ||

      address.shop ||

      address.amenity ||

      address.hotel ||

      address.building ||

      address.neighbourhood ||

      address.suburb ||

      address.quarter ||

      address.city_district ||

      address.city ||

      address.town ||

      address.village ||

      "";


    if (

  }

}


/* =========================================================
   Distance
========================================================= */

function calculateDistanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const toRad =
    value =>
      value *
      Math.PI /
      180;


  const dLat =
    toRad(
      lat2 -
      lat1
    );


  const dLon =
    toRad(
      lon2 -
      lon1
    );


  const a =

    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );


  return (
    R *
    c
  );

}


function calculateGroupDistance(
  records
) {

  let total =
    0;


  for (
    let i = 1;
    i < records.length;
    i++
  ) {

    total +=
      calculateDistanceKm(

        Number(
          records[i - 1].latitude
        ),

        Number(
          records[i - 1].longitude
        ),

        Number(
          records[i].latitude
        ),

        Number(
          records[i].longitude
        )

      );

  }


  return total;

}


function formatDistance(
  km
) {

  if (
    km < 1
  ) {

    return (
      Math.round(
        km *
        1000
      ) +
      " m"
    );

  }


  if (
    km < 10
  ) {

    return (
      km.toFixed(2) +
      " km"
    );

  }


  return (
    km.toFixed(1) +
    " km"
  );

}


/* =========================================================
   Duplicate Check
========================================================= */

function checkDuplicateRecord(
  newLat,
  newLng,
  newTime
) {

  const records =
    getRecords();


  if (
    records.length === 0
  ) {

    return false;

  }


  const sorted =
    [...records]
      .sort(
        (
          a,
          b
        ) =>
          new Date(
            a.timestamp
          ) -
          new Date(
            b.timestamp
          )
      );


  const last =
    sorted[
      sorted.length - 1
    ];


  const lastTime =
    new Date(
      last.timestamp
    );


  const seconds =

    Math.abs(
      newTime -
      lastTime
    ) /
    1000;


  const meters =

    calculateDistanceKm(

      Number(
        last.latitude
      ),

      Number(
        last.longitude
      ),

      Number(
        newLat
      ),

      Number(
        newLng
      )

    ) *
    1000;


  if (
    seconds <= 60 &&
    meters <= 30
  ) {

    return {

      record:
        last,

      seconds:
        Math.round(
          seconds
        ),

      meters:
        Math.round(
          meters
        )

    };

  }


  return false;

}

/* =========================================================
   Date / Time
========================================================= */

function formatDateTimeForZone(
  date,
  timeZone
) {

  try {

    return date
      .toLocaleString(
        "zh-TW",
        {

          timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }
      );

  }

  catch {

    return date
      .toLocaleString(
        "zh-TW"
      );

  }

}


function formatRecordTime(
  record
) {

  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  return date
    .toLocaleTimeString(
      "zh-TW",
      {

        timeZone,

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false

      }
    );

}


function getRecordDateKey(
  record
) {

  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"

      }
    )
    .formatToParts(
      date
    );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );


  return (

    values.year +
    "-" +
    values.month +
    "-" +
    values.day

  );

}


function formatDayTitle(
  record
) {

  return new Date(
    record.timestamp
  )
  .toLocaleDateString(
    "zh-TW",
    {

      timeZone:
        record.timeZone ||
        getCurrentTimeZone(),

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      weekday:
        "long"

    }
  );

}


/* =========================================================
   Group
========================================================= */

function groupRecordsByDay(
  records
) {

  const groups =
    {};


  records.forEach(
    record => {

      const key =
        getRecordDateKey(
          record
        );


      if (
        !groups[key]
      ) {

        groups[key] =
          [];

      }


      groups[key]
        .push(
          record
        );

    }
  );


  return groups;

}

                    );
                  "
                >

                  🗑️ 刪除

                </button>

              </div>

            </div>


            <div
              class="record-detail"
              onclick="
                focusRecordOnMap(
                  '${String(record.id)}'
                )
              "
            >

              GPS：
              ${Number(
                record.latitude
              ).toFixed(6)},

              ${Number(
                record.longitude
              ).toFixed(6)}

              <br>

              精度：
              ±${Math.round(
                record.accuracy ||
                0
              )}
              公尺

              <br>


              <span
                class="record-timezone"
              >

                🕐
                ${escapeHTML(
                  timezoneText
                )}

              </span>


              ${
                distanceText

                ?

                `

                <span
                  class="record-distance"
                >

                  ↗ 前一站
                  ${distanceText}

                </span>

                `

                :

                ""

              }

            </div>


            ${
              record.note

              ?

              `

              <div class="record-note">

                📝
                ${escapeHTML(
                  record.note
                )}

              </div>

              `

              :

              ""

            }

          `;


          dayGroup.appendChild(
            div
          );


          const marker =
            L.marker(
              [
                Number(
                  record.latitude
                ),
                Number(
                  record.longitude
                )
              ]
            )
            .addTo(
              map
            )
            .bindPopup(

              `

              <b>
                ${markerIndex}.
                ${escapeHTML(
                  record.place
                )}
              </b>

              <br>

              ${dateKey}
              ${formatRecordTime(
                record
              )}

              <br>

              🕐
              ${escapeHTML(
                timezoneText
              )}

              `

            );


          /*
            V4 新增：
            Marker 點擊 → 捲到紀錄
          */

          marker.on(
            "click",
            () => {

              scrollToRecord(
                record.id
              );

            }
          );


          recordMarkers.push(
            marker
          );


          markerByRecordId.set(
            String(
              record.id
            ),
            marker
          );


          path.push(
            [
              Number(
                record.latitude
              ),
              Number(
                record.longitude
              )
            ]
          );


          markerIndex++;

        }
      );


      list.appendChild(
        dayGroup
      );

    }
  );


  if (
    path.length >= 2
  ) {

    pathLayer =
      L.polyline(
        path,
        {

          weight:
            4,

          opacity:
            0.7

        }
      )
      .addTo(
        map
      );

  }


  if (
    path.length > 0
  ) {

    map.fitBounds(
      L.latLngBounds(
        path
      ),
      {

        padding:
          [30,30],

        maxZoom:
          16

      }
    );

  }

}


/* =========================================================
   Stats
========================================================= */

function updateStats(
  records
) {

  document
    .getElementById(
      "recordCount"
    )
    .textContent =
    records.length;


  const groups =
    groupRecordsByDay(
      records
    );


  document
    .getElementById(
      "dayCount"
    )
    .textContent =
    Object.keys(
      groups
    )
    .length;


  let total =
    0;


  Object.values(
    groups
  )
  .forEach(
    day =>
      total +=
        calculateGroupDistance(
          day
        )
  );


  document
    .getElementById(
      "totalDistance"
    )
    .textContent =
    formatDistance(
      total
    );

}

   Delete
========================================================= */

async function deleteRecord(
  id
) {

  const records =
    getRecords();


  const target =
    records.find(
      item =>
        String(
          item.id
        ) ===
        String(
          id
        )
    );


  if (
    !target
  ) {

    return;

  }


  const ok =
    await showDialog({

      icon:
        "🗑️",

      title:
        "刪除足跡",

      message:

        "確定要刪除這筆足跡嗎？\n\n" +

        "📍 " +
        (
          target.place ||
          "未命名地點"
        ) +

        "\n" +

        formatRecordTime(
          target
        ),

      confirmText:
        "刪除",

      cancelText:
        "取消",

      danger:
        true

    });


  if (
    !ok
  ) {

    return;

  }


  const newRecords =
    records.filter(
      item =>
        String(
          item.id
        ) !==
        String(
          id
        )
    );


  saveRecords(
    newRecords
  );


  updateDateFilterOptions();

  renderRecords();


  showToast(
    "✅ 已刪除：" +
    target.place
  );

}

function getEditableDateTimeParts(
  record
) {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone:
          record.timeZone ||
          getCurrentTimeZone(),

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      new Date(
        record.timestamp
      )
    );


  const values =
    {};


  parts.forEach(
    part =>
      values[
        part.type
      ] =
      part.value
  );


  return {

    date:

      values.year +
      "-" +
      values.month +
      "-" +
      values.day,

    time:

      values.hour +
      ":" +
      values.minute +
      ":" +
      values.second

  };

}


function localDateTimeToUTC(
  dateText,
  timeText,
  timeZone
) {

  const [
    year,
    month,
    day
  ] =
  dateText
    .split("-")
    .map(Number);


  const [
    hour,
    minute,
    second = 0
  ] =
  timeText
    .split(":")
    .map(Number);


  const guess =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      )
    );


  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      guess
    );


  const values =
    {};


  parts.forEach(
    part =>
      values[
        part.type
      ] =
      part.value
  );


  const displayed =
    Date.UTC(

      Number(
        values.year
      ),

      Number(
        values.month
      ) - 1,

      Number(
        values.day
      ),

      Number(
        values.hour
      ),

      Number(
        values.minute
      ),

      Number(
        values.second
      )

    );


  const desired =
    Date.UTC(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    );


  return new Date(

    guess.getTime() +

    desired -

    displayed

  );

}


async function saveEditedRecord() {

  const id =
    document
      .getElementById(
        "editRecordId"
      )
      .value;


  const records =
    getRecords();


  const index =
    records.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(
          id
        )
    );


  if (
    index === -1
  ) {

    return;

  }


  const dateText =
    document
      .getElementById(
        "editDate"
      )
      .value;


  const timeText =
    document
      .getElementById(
        "editTime"
      )
      .value;


  if (
    !dateText ||
    !timeText
  ) {

    await showDialog({

      icon:
        "⚠️",

      title:
        "資料不完整",

      message:
        "請輸入日期與時間。",

      showCancel:
        false

    });


    return;

  }


  const record =
    records[
      index
    ];


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  const newDate =
    localDateTimeToUTC(

      dateText,

      timeText,

      timeZone

    );


  record.place =
    document
      .getElementById(
        "editPlace"
      )
      .value
      .trim() ||
    "未命名地點";


  record.note =
    document
      .getElementById(
        "editNote"
      )
      .value
      .trim();


  record.timestamp =
    newDate
      .toISOString();


  record.localTime =
    formatDateTimeForZone(
      newDate,
      timeZone
    );


  records[
    index
  ] =
  record;


  saveRecords(
    records
  );


  closeEditModal();


  updateDateFilterOptions();

  renderRecords();


  showToast(
    "✅ 足跡已修改"
  );

}

/* =========================================================
   CSV
========================================================= */

function exportCSV() {

  const records =
    getRecords();


  if (
    records.length === 0
  ) {

    showToast(
      "目前沒有紀錄"
    );

    return;

  }


  const rows = [[

    "當地日期",

    "當地時間",

    "地點",

    "時區",

    "GMT",

    "UTC時間",

    "緯度",

    "經度",

    "GPS精度",

    "備註",

    "ID"

  ]];


  records
    .sort(
      (
        a,
        b
      ) =>
        new Date(
          a.timestamp
        ) -
        new Date(
          b.timestamp
        )
    )
    .forEach(
      record => {

        rows.push([

          getRecordDateKey(
            record
          ),

          formatRecordTime(
            record
          ),

          record.place,

          record.timeZone ||
          "",

          record.gmtOffset ||
          "",

          record.timestamp,

          record.latitude,

          record.longitude,

          record.accuracy,

          record.note,

          record.id

        ]);

      }
    );


  const csv =

    "\uFEFF" +

    rows
      .map(
        row =>
          row
            .map(
              csvEscape
            )
            .join(",")
      )
      .join("\n");


  downloadFile(

    csv,

    "travel-footprints.csv",

    "text/csv;charset=utf-8"

  );

}

/* =========================================================
   JSON Import
========================================================= */

function importJSON(
  event
) {

  const file =
    event
      .target
      .files[0];


  if (
    !file
  ) {

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );


        let importedRecords =
          null;


        /*
          V2:
          [ {...}, {...} ]

          V3 / V4:
          {
            version: 3/4,
            records: [...]
          }
        */

        if (
          Array.isArray(
            data
          )
        ) {

          importedRecords =
            data;

        }

        else if (
          data &&
          Array.isArray(
            data.records
          )
        ) {

          importedRecords =
            data.records;

        }


        if (
          !importedRecords
        ) {

          throw new Error(
            "不是有效的足跡 JSON 備份。"
          );

        }


        const valid =
          importedRecords.every(
            record =>

              record &&

              record.timestamp &&

              record.latitude !==
              undefined &&

              record.longitude !==
              undefined
          );


        if (
          !valid
        ) {

          throw new Error(
            "備份中含有無效紀錄。"
          );

        }


        importedRecords =
          importedRecords.map(
            record => {

              if (
                record.id ===
                undefined ||
                record.id ===
                null ||
                record.id ===
                ""
              ) {

                record.id =
                  generateRecordId();

              }


              return record;

            }
          );


        const ok =
          await showDialog({

            icon:
              "📥",

            title:
              "匯入 JSON 備份",

            message:

              "找到 " +
              importedRecords.length +
              " 筆足跡。\n\n" +

              "匯入後會取代目前手機上的所有紀錄。\n\n" +

              "確定要繼續嗎？",

            confirmText:
              "開始匯入",

            cancelText:
              "取消"

          });


        if (
          !ok
        ) {

          return;

        }


        saveRecords(
          importedRecords
        );


        currentDateFilter =
          "all";


        updateDateFilterOptions();

        renderRecords();


        showToast(

          "✅ 已還原 " +

          importedRecords.length +

          " 筆足跡"

        );

      }

      catch (
        error
      ) {

        await showDialog({

          icon:
            "❌",

          title:
            "匯入失敗",

          message:
            error.message,

          showCancel:
            false

        });

      }

      finally {

        event.target.value =
          "";

      }

    };


  reader.readAsText(
    file
  );

}


/* =========================================================
   Download
========================================================= */

function downloadFile(
  content,
  filename,
  type
) {

  const blob =
    new Blob(
      [content],
      {
        type
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    filename;


  document.body
    .appendChild(
      a
    );


  a.click();


  document.body
    .removeChild(
      a
    );


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


/* =========================================================
   Helpers
========================================================= */

function csvEscape(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const str =
    String(
      value
    );


  if (
    str.includes(",") ||
    str.includes('"') ||
    str.includes("\n")
  ) {

    return (

      '"' +

      str.replace(
        /"/g,
        '""'
      ) +

      '"'

    );

  }


  return str;

}


function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text ||
    "";


  return div.innerHTML;

}
