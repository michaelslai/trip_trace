<!--
=============================================================
  我的旅遊足跡 V4.3
=============================================================

【V4.3 新增 / 修改功能】

1. 附近地點查詢改為多個 Overpass API 節點
   - 節點 1：overpass-api.de
   - 節點 2：overpass.kumi.systems
   - 節點 3：overpass.private.coffee
   - 前一個失敗才嘗試下一個
   - 任一節點成功就立即停止

2. Overpass 查詢加入 Timeout
   - 每個 API 節點最多等待 1.2 秒
   - 避免旅行途中因 API 太慢而卡住
   - 最差約 3.6 ~ 4 秒內結束 Overpass 查詢

3. 附近地點查詢範圍改為固定 1000 公尺
   - 不再先查 800m、再查 1500m
   - 只送一次查詢
   - 減少等待時間

4. 附近地點只顯示最近 5 個
   - 依 GPS 直線距離排序
   - 不要求一定要湊滿 5 筆
   - 找到 2 個就顯示 2 個

5. 新增同名地點去重
   - OSM 可能同一地點同時存在 Node / Way / Relation
   - 例如「師大附中」可能出現兩筆
   - V4.3 只保留距離最近的一筆

6. Overpass 全部失敗時
   - 自動改用 Nominatim Reverse Geocoding
   - 顯示：
     「附近 5 個地點查詢失敗，已改用 GPS 自動判斷地名」
   - 使用者仍可自行修改地點名稱

7. 保留附近地點選擇
   - 點擊附近地點後
   - 自動填入「地點名稱」
   - 仍可手動修改

8. 保留 V4.1 Record ID 修正
   - 缺少 ID 自動補 UUID
   - 重複 ID 自動換新 UUID
   - 相同地點 / GPS / 時間仍可視為不同紀錄

9. 保留 V4 功能
   - 自製 Modal
   - Toast
   - 日期篩選
   - Marker ↔ 足跡列表連動
   - 自動時區
   - GMT+8 / GMT+9
   - 每日距離
   - 旅行總距離
   - CSV 匯出
   - JSON 備份 / 還原

10. JSON 相容
    - 支援 V2
    - 支援 V3
    - 支援 V4
    - 支援 V4.1
    - 支援 V4.2
    - 支援 V4.3

Storage Key : travelFootprints
Version     : V4.3
=============================================================
-->

/* =========================================================
   ID
========================================================= */

function generateRecordId() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
    "function"
  ) {

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =========================================================
   NORMALIZE ID
========================================================= */

function normalizeRecordIds(
  records
) {

  const usedIds =
    new Set();

  let changed =
    false;


  records.forEach(
    record => {

      let id =
        record.id !== undefined &&
        record.id !== null
          ? String(record.id)
          : "";


      if (
        !id ||
        usedIds.has(id)
      ) {

        record.id =
          generateRecordId();

        id =
          String(
            record.id
          );

        changed =
          true;

      }


      usedIds.add(
        id
      );

    }
  );


  return {
    records,
    changed
  };

}

/* =========================================================
   TIMEZONE
========================================================= */

function getCurrentTimeZone() {

  try {

    return Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone ||
      "UTC";

  }

  catch {

    return "UTC";

  }

}


function getGMTOffset(
  date = new Date()
) {

  const offsetMinutes =
    -date.getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const absoluteMinutes =
    Math.abs(
      offsetMinutes
    );


  const hours =
    Math.floor(
      absoluteMinutes / 60
    );


  const minutes =
    absoluteMinutes % 60;


  if (
    minutes === 0
  ) {

    return (
      "GMT" +
      sign +
      hours
    );

  }


  return (

    "GMT" +
    sign +
    hours +
    ":" +
    String(minutes)
      .padStart(2,"0")

  );

}


function getUTCOffsetMinutes() {

  return (
    -new Date()
      .getTimezoneOffset()
  );

}

  try {

    return result.records;

  }

  catch (
    error

    );

/* =========================================================
   GPS
========================================================= */

function getCurrentLocation() {

  const status =
    document.getElementById(
      "gpsStatus"
    );


  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "❌ 此瀏覽器不支援 GPS 定位。";

    return;

  }


  status.textContent =
    "📡 正在取得 GPS 位置...";


  /*
    新的一次 GPS 定位，
    先清掉舊的附近地點畫面
  */

  resetNearbyPlaces();


  navigator
    .geolocation
    .getCurrentPosition(

      async function(position) {

        currentLat =
          position.coords.latitude;

        currentLng =
          position.coords.longitude;

        currentAccuracy =
          position.coords.accuracy;


        document
          .getElementById(
            "lat"
          )
          .textContent =
          currentLat.toFixed(6);


        document
          .getElementById(
            "lng"
          )
          .textContent =
          currentLng.toFixed(6);


        document
          .getElementById(
            "accuracy"
          )
          .textContent =
          "±" +
          Math.round(
            currentAccuracy
          ) +
          " 公尺";


        status.textContent =
          "✅ GPS 定位成功";


        if (
          currentMarker
        ) {

          map.removeLayer(
            currentMarker
          );

        }


        currentMarker =
          L.marker(
            [
              currentLat,
              currentLng
            ]
          )
          .addTo(
            map
          )
          .bindPopup(
            "📍 目前位置"
          )
          .openPopup();


        map.setView(
          [
            currentLat,
            currentLng
          ],
          16
        );


        /*
          V4.3：
          GPS 成功後立即查附近 POI
        */

        loadNearbyPlaces(
          currentLat,
          currentLng
        );

      },


      function(error) {

        console.error(
          error
        );


        switch (
          error.code
        ) {

          case error.PERMISSION_DENIED:

            status.textContent =
              "❌ 定位權限被拒絕。";

            break;


          case error.POSITION_UNAVAILABLE:

            status.textContent =
              "❌ 無法取得目前位置。";

            break;


          case error.TIMEOUT:

            status.textContent =
              "❌ GPS 定位逾時。";

            break;


          default:

            status.textContent =
              "❌ GPS 定位失敗。";

        }

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          0

      }

    );

}

/* =========================================================
   V4.3
   fetch timeout
========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeoutMs = 1200
) {

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () => {

        controller.abort();

      },
      timeoutMs
    );


  try {

    return await fetch(
      url,
      {

        ...options,

        signal:
          controller.signal

      }
    );

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


/* =========================================================
   V4.3
   建立 Overpass Query
========================================================= */

function buildOverpassQuery(
  lat,
  lng,
  radius
) {

  return `

[out:json][timeout:10];

(
  nwr(around:${radius},${lat},${lng})["name"]["amenity"];
  nwr(around:${radius},${lat},${lng})["name"]["shop"];
  nwr(around:${radius},${lat},${lng})["name"]["tourism"];

  nwr(around:${radius},${lat},${lng})["name"]["railway"="station"];
  nwr(around:${radius},${lat},${lng})["name"]["railway"="halt"];

  nwr(around:${radius},${lat},${lng})["name"]["public_transport"];

  nwr(around:${radius},${lat},${lng})["name"]["leisure"];

  nwr(around:${radius},${lat},${lng})["name"]["office"];

  nwr(around:${radius},${lat},${lng})["name"]["building"];
);

out center tags;

`;

}


/* =========================================================
   V4.3
   多 Overpass Server 輪流嘗試
========================================================= */

async function fetchNearbyPlaces(
  lat,
  lng
) {

  const query =
    buildOverpassQuery(
      lat,
      lng,
      OVERPASS_RADIUS
    );


  let lastError =
    null;


  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      console.log(
        "Overpass Try:",
        server
      );


      const response =
        await fetchWithTimeout(

          server,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"

            },

            body:

              "data=" +
              encodeURIComponent(
                query
              )

          },

          OVERPASS_TIMEOUT_MS

        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      console.log(
        "Overpass Success:",
        server
      );


      return parseNearbyPlaces(
        data,
        lat,
        lng
      );

    }

    catch (
      error
    ) {

      lastError =
        error;


      console.log(

        "Overpass Failed:",

        server,

        error.name ||
        error.message

      );

    }

  }


  throw (
    lastError ||
    new Error(
      "所有 Overpass API 都失敗"
    )
  );

}


/* =========================================================
   V4.3
   解析 POI
   + 距離排序
   + 同名去重
========================================================= */

function parseNearbyPlaces(
  data,
  lat,
  lng
) {

  const candidates =
    [];


  for (
    const element of
    data.elements || []
  ) {

    const tags =
      element.tags ||
      {};


    const name =
      tags.name
        ? String(
            tags.name
          ).trim()
        : "";


    if (
      !name
    ) {

      continue;

    }


    const pLat =
      element.lat ??
      element.center?.lat;


    const pLng =
      element.lon ??
      element.center?.lon;


    if (
      pLat === undefined ||
      pLng === undefined
    ) {

      continue;

    }


    const distanceKm =
      calculateDistanceKm(

        Number(lat),

        Number(lng),

        Number(pLat),

        Number(pLng)

      );


    candidates.push({

      name:
        name,

      lat:
        Number(pLat),

      lng:
        Number(pLng),

      distanceKm:
        distanceKm,

      category:
        detectPoiCategory(
          tags
        )

    });

  }


  /*
    先依距離排序
  */

  candidates.sort(
    (
      a,
      b
    ) =>
      a.distanceKm -
      b.distanceKm
  );


  /*
    V4.3：
    同名去重。

    因為已依距離排序，
    第一筆一定是最近的。
  */

  const seenNames =
    new Set();


  const uniquePlaces =
    [];


  for (
    const place of
    candidates
  ) {

    /*
      去除前後空白 + 小寫
      當成名稱比較 Key
    */

    const key =
      place.name
        .trim()
        .toLocaleLowerCase();


    if (
      seenNames.has(
        key
      )
    ) {

      continue;

    }


    seenNames.add(
      key
    );


    uniquePlaces.push(
      place
    );


    /*
      最多只需要 5 個
    */

    if (
      uniquePlaces.length >=
      5
    ) {

      break;

    }

  }


  return uniquePlaces;

}


/* =========================================================
   POI CATEGORY
========================================================= */

function detectPoiCategory(
  tags
) {

  if (
    tags.railway ===
    "station" ||
    tags.railway ===
    "halt"
  ) {

    return "車站";

  }


  if (
    tags.amenity ===
    "restaurant"
  ) {

    return "餐廳";

  }


  if (
    tags.amenity ===
    "cafe"
  ) {

    return "咖啡店";

  }


  if (
    tags.amenity ===
    "fast_food"
  ) {

    return "餐飲";

  }


  if (
    tags.amenity
  ) {

    return "設施";

  }


  if (
    tags.shop
  ) {

    return "商店";

  }


  if (
    tags.tourism
  ) {

    return "景點";

  }


  if (
    tags.leisure
  ) {

    return "休閒";

  }


  if (
    tags.office
  ) {

    return "辦公地點";

  }


  if (
    tags.building
  ) {

    return "建築";

  }


  return "地點";

}

/* =========================================================
   NOMINATIM FALLBACK
========================================================= */

async function autoDetectPlaceName(
  lat,
  lng
) {

  const input =
    document.getElementById(
      "placeName"
    );


  try {

    const url =

      "https://nominatim.openstreetmap.org/reverse" +

      "?format=jsonv2" +

      "&lat=" +
      encodeURIComponent(lat) +

      "&lon=" +
      encodeURIComponent(lng) +

      "&accept-language=zh-TW,zh,en";


    /*
      Nominatim 也加 timeout，
      避免 fallback 又卡太久。
      這裡給 1.5 秒。
    */

    const response =
      await fetchWithTimeout(
        url,
        {},
        1500
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    const address =
      data.address ||
      {};


    const name =

      data.name ||

      address.attraction ||

      address.tourism ||

      address.station ||

      address.railway ||

      address.shop ||

      address.amenity ||

      address.hotel ||

      address.building ||

      address.neighbourhood ||

      address.suburb ||

      address.quarter ||

      address.city_district ||

      address.city ||

      address.town ||

      address.village ||

      "";


    if (
      name &&
      !input.value.trim()
    ) {

      input.value =
        name;

    }

  }

  catch (
    error
  ) {

    console.log(
      "Nominatim fallback failed:",
      error
    );

  }

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const toRad =
    value =>
      value *
      Math.PI /
      180;


  const dLat =
    toRad(
      lat2 -
      lat1
    );


  const dLon =
    toRad(
      lon2 -
      lon1
    );


  const a =

    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );


  return (
    R *
    c
  );

}


function calculateGroupDistance(
  records
) {

  let total =
    0;


  for (
    let i = 1;
    i < records.length;
    i++
  ) {

    total +=
      calculateDistanceKm(

        Number(
          records[i - 1]
            .latitude
        ),

        Number(
          records[i - 1]
            .longitude
        ),

        Number(
          records[i]
            .latitude
        ),

        Number(
          records[i]
            .longitude
        )

      );

  }


  return total;

}


function formatDistance(
  km
) {

  if (
    km < 1
  ) {

    return (
      Math.round(
        km *
        1000
      ) +
      " m"
    );

  }


  if (
    km < 10
  ) {

    return (
      km.toFixed(2) +
      " km"
    );

  }


  return (
    km.toFixed(1) +
    " km"
  );

}


/* =========================================================
   DUPLICATE CHECK
========================================================= */

function checkDuplicateRecord(
  newLat,
  newLng,
  newTime
) {

  const records =
    getRecords();


  if (
    records.length === 0
  ) {

    return false;

  }


  const sorted =
    [...records]
      .sort(
        (
          a,
          b
        ) =>
          new Date(
            a.timestamp
          ) -
          new Date(
            b.timestamp
          )
      );


  const last =
    sorted[
      sorted.length - 1
    ];


  const lastTime =
    new Date(
      last.timestamp
    );


  const seconds =

    Math.abs(
      newTime -
      lastTime
    ) /
    1000;


  const meters =

    calculateDistanceKm(

      Number(
        last.latitude
      ),

      Number(
        last.longitude
      ),

      Number(
        newLat
      ),

      Number(
        newLng
      )

    ) *
    1000;


  if (
    seconds <= 60 &&
    meters <= 30
  ) {

    return {

      record:
        last,

      seconds:
        Math.round(
          seconds
        ),

      meters:
        Math.round(
          meters
        )

    };

  }


  return false;

}


/* =========================================================
   SAVE RECORD
========================================================= */

async function saveLocation() {

  if (
    currentLat === null ||
    currentLng === null
  ) {

    await showDialog({

      icon:
        "📍",

      title:
        "尚未定位",

      message:
        "請先按「取得目前 GPS」。",

      showCancel:
        false

    });


    return;

  }


  const placeName =
    document
      .getElementById(
        "placeName"
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        "note"
      )
      .value
      .trim();


  const recordTime =
    new Date();


  const duplicate =
    checkDuplicateRecord(

      currentLat,

      currentLng,

      recordTime

    );


  if (
    duplicate
  ) {

    const ok =
      await showDialog({

        icon:
          "⚠️",

        title:
          "可能是重複紀錄",

        message:

          "上一筆：" +
          (
            duplicate.record.place ||
            "未命名地點"
          ) +

          "\n時間相差：" +
          duplicate.seconds +
          " 秒" +

          "\n距離：約 " +
          duplicate.meters +
          " 公尺" +

          "\n\n仍然要新增嗎？",

        confirmText:
          "仍然新增",

        cancelText:
          "取消"

      });


    if (
      !ok
    ) {

      return;

    }

  }


  const timeZone =
    getCurrentTimeZone();


  const record = {

    id:
      generateRecordId(),

    latitude:
      currentLat,

    longitude:
      currentLng,

    accuracy:
      currentAccuracy,

    place:
      placeName ||
      "未命名地點",

    note:
      note,

    timestamp:
      recordTime
        .toISOString(),

    timeZone:
      timeZone,

    gmtOffset:
      getGMTOffset(
        recordTime
      ),

    utcOffsetMinutes:
      getUTCOffsetMinutes(),

    localTime:
      formatDateTimeForZone(
        recordTime,
        timeZone
      )

  };


  const records =
    getRecords();


  records.push(
    record
  );


  saveRecords(
    records
  );


  document
    .getElementById(
      "note"
    )
    .value =
    "";


  updateDateFilterOptions();

  renderRecords();


  showToast(
    "✅ 已紀錄：" +
    record.place
  );

}


/* =========================================================
   DATE / TIME
========================================================= */

function formatDateTimeForZone(
  date,
  timeZone
) {

  try {

    return date
      .toLocaleString(
        "zh-TW",
        {

          timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }
      );

  }

  catch {

    return date
      .toLocaleString(
        "zh-TW"
      );

  }

}


function formatRecordTime(
  record
) {

  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  return date
    .toLocaleTimeString(
      "zh-TW",
      {

        timeZone,

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false

      }
    );

}


function getRecordDateKey(
  record
) {

  const date =
    new Date(
      record.timestamp
    );


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"

      }
    )
    .formatToParts(
      date
    );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );


  return (

    values.year +
    "-" +
    values.month +
    "-" +
    values.day

  );

}


function formatDayTitle(
  record
) {

  return new Date(
    record.timestamp
  )
  .toLocaleDateString(
    "zh-TW",
    {

      timeZone:
        record.timeZone ||
        getCurrentTimeZone(),

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      weekday:
        "long"

    }
  );

}


/* =========================================================
   GROUP
========================================================= */

function groupRecordsByDay(
  records
) {

  const groups =
    {};


  records.forEach(
    record => {

      const key =
        getRecordDateKey(
          record
        );


      if (
        !groups[key]
      ) {

        groups[key] =
          [];

      }


      groups[key].push(
        record
      );

    }
  );


  return groups;

}


/* =========================================================
   DATE FILTER
========================================================= */

function updateDateFilterOptions() {

  const select =
    document.getElementById(
      "dateFilter"
    );


  const records =
    getRecords();


  const keys =
    [...new Set(

      records.map(
        getRecordDateKey
      )

    )]
    .sort()
    .reverse();


  select.innerHTML =
    '<option value="all">全部日期</option>';


  keys.forEach(
    key => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        key;


      option.textContent =
        key.replaceAll(
          "-",
          "/"
        );


      select.appendChild(
        option
      );

    }
  );


  if (
    currentDateFilter !==
    "all" &&
    keys.includes(
      currentDateFilter
    )
  ) {

    select.value =
      currentDateFilter;

  }

  else {

    currentDateFilter =
      "all";

    select.value =
      "all";

  }

}


function changeDateFilter() {

  currentDateFilter =
    document
      .getElementById(
        "dateFilter"
      )
      .value;


  renderRecords();

}


/* =========================================================
   MAP ↔ RECORD
========================================================= */

function scrollToRecord(
  id
) {

  const elements =
    document.querySelectorAll(
      ".record"
    );


  let target =
    null;


  elements.forEach(
    element => {

      if (
        String(
          element.dataset.recordId
        ) ===
        String(
          id
        )
      ) {

        target =
          element;

      }

    }
  );


  if (
    !target
  ) {

    return;

  }


  target.scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });


  target.classList.add(
    "record-highlight"
  );


  setTimeout(
    () => {

      target
        .classList
        .remove(
          "record-highlight"
        );

    },
    1800
  );

}


function focusRecordOnMap(
  id
) {

  const marker =
    markerByRecordId.get(
      String(id)
    );


  if (
    !marker
  ) {

    return;

  }


  map.setView(
    marker.getLatLng(),
    16
  );


  marker.openPopup();

}


/* =========================================================
   RENDER
========================================================= */

function renderRecords() {

  const allRecords =
    getRecords()
      .sort(
        (
          a,
          b
        ) =>
          new Date(
            a.timestamp
          ) -
          new Date(
            b.timestamp
          )
      );


  updateStats(
    allRecords
  );


  const list =
    document.getElementById(
      "recordList"
    );


  list.innerHTML =
    "";


  recordMarkers.forEach(
    marker =>
      map.removeLayer(
        marker
      )
  );


  recordMarkers =
    [];


  markerByRecordId.clear();


  if (
    pathLayer
  ) {

    map.removeLayer(
      pathLayer
    );

    pathLayer =
      null;

  }


  let displayRecords =
    allRecords;


  if (
    currentDateFilter !==
    "all"
  ) {

    displayRecords =
      allRecords.filter(
        record =>
          getRecordDateKey(
            record
          ) ===
          currentDateFilter
      );

  }


  if (
    displayRecords.length ===
    0
  ) {

    list.innerHTML =
      '<div class="empty">此日期沒有足跡</div>';

    return;

  }


  const groups =
    groupRecordsByDay(
      displayRecords
    );


  const dateKeys =
    Object
      .keys(
        groups
      )
      .sort();


  const path =
    [];


  let markerIndex =
    1;


  dateKeys.forEach(
    dateKey => {

      const dayRecords =
        groups[
          dateKey
        ];


      const dayDistance =
        calculateGroupDistance(
          dayRecords
        );


      const dayGroup =
        document.createElement(
          "div"
        );


      dayGroup.className =
        "day-group";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "day-header";


      header.innerHTML = `

        <div class="day-title">

          📅
          ${escapeHTML(
            formatDayTitle(
              dayRecords[0]
            )
          )}

        </div>

        <div class="day-summary">

          📍
          ${dayRecords.length}
          個足跡

          ・

          🚗
          移動約
          ${formatDistance(
            dayDistance
          )}

        </div>

      `;


      dayGroup.appendChild(
        header
      );


      dayRecords.forEach(
        (
          record,
          index
        ) => {


          let distanceText =
            "";


          if (
            index > 0
          ) {

            distanceText =
              formatDistance(

                calculateDistanceKm(

                  Number(
                    dayRecords[
                      index - 1
                    ].latitude
                  ),

                  Number(
                    dayRecords[
                      index - 1
                    ].longitude
                  ),

                  Number(
                    record.latitude
                  ),

                  Number(
                    record.longitude
                  )

                )

              );

          }


          const zone =
            record.timeZone ||
            "舊版紀錄";


          const timezoneText =
            record.gmtOffset
              ? zone +
                " · " +
                record.gmtOffset
              : zone;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "record";


          div.dataset.recordId =
            String(
              record.id
            );


          div.innerHTML = `

            <div class="record-top">

              <div
                class="record-main"
                onclick="
                  focusRecordOnMap(
                    '${String(record.id)}'
                  )
                "
              >

                <div class="record-time">
                  ${formatRecordTime(
                    record
                  )}
                </div>

                <div class="record-place">

                  📍
                  ${escapeHTML(
                    record.place
                  )}

                </div>

              </div>


              <div class="record-actions">

                <button
                  class="edit-btn"
                  onclick="
                    event.stopPropagation();
                    openEditModal(
                      '${String(record.id)}'
                    );
                  "
                >
                  ✏️ 編輯
                </button>


                <button
                  class="delete-btn"
                  onclick="
                    event.stopPropagation();
                    deleteRecord(
                      '${String(record.id)}'
                    );
                  "
                >
                  🗑️ 刪除
                </button>

              </div>

            </div>


            <div
              class="record-detail"
              onclick="
                focusRecordOnMap(
                  '${String(record.id)}'
                )
              "
            >

              GPS：
              ${Number(
                record.latitude
              ).toFixed(6)},

              ${Number(
                record.longitude
              ).toFixed(6)}

              <br>

              精度：
              ±${Math.round(
                record.accuracy ||
                0
              )}
              公尺

              <br>


              <span
                class="record-timezone"
              >

                🕐
                ${escapeHTML(
                  timezoneText
                )}

              </span>


              ${
                distanceText

                ?

                `
                <span
                  class="record-distance"
                >
                  ↗ 前一站
                  ${distanceText}
                </span>
                `

                :

                ""

              }

            </div>


            ${
              record.note

              ?

              `
              <div class="record-note">

                📝
                ${escapeHTML(
                  record.note
                )}

              </div>
              `

              :

              ""

            }

          `;


          dayGroup.appendChild(
            div
          );


          const marker =
            L.marker(
              [
                Number(
                  record.latitude
                ),
                Number(
                  record.longitude
                )
              ]
            )
            .addTo(
              map
            )
            .bindPopup(

              `

              <b>

                ${markerIndex}.
                ${escapeHTML(
                  record.place
                )}

              </b>

              <br>

              ${dateKey}
              ${formatRecordTime(
                record
              )}

              <br>

              🕐
              ${escapeHTML(
                timezoneText
              )}

              `

            );


          marker.on(
            "click",
            () => {

              scrollToRecord(
                record.id
              );

            }
          );


          recordMarkers.push(
            marker
          );


          markerByRecordId.set(
            String(
              record.id
            ),
            marker
          );


          path.push(
            [
              Number(
                record.latitude
              ),
              Number(
                record.longitude
              )
            ]
          );


          markerIndex++;

        }
      );


      list.appendChild(
        dayGroup
      );

    }
  );


  if (
    path.length >= 2
  ) {

    pathLayer =
      L.polyline(
        path,
        {
          weight:
            4,

          opacity:
            0.7
        }
      )
      .addTo(
        map
      );

  }


  if (
    path.length > 0
  ) {

    map.fitBounds(
      L.latLngBounds(
        path
      ),
      {

        padding:
          [30,30],

        maxZoom:
          16

      }
    );

  }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(
  records
) {

  document
    .getElementById(
      "recordCount"
    )
    .textContent =
    records.length;


  const groups =
    groupRecordsByDay(
      records
    );


  document
    .getElementById(
      "dayCount"
    )
    .textContent =
    Object.keys(
      groups
    )
    .length;


  let total =
    0;


  Object.values(
    groups
  )
  .forEach(
    day => {

      total +=
        calculateGroupDistance(
          day
        );

    }
  );


  document
    .getElementById(
      "totalDistance"
    )
    .textContent =
    formatDistance(
      total
    );

}

) {

  const records =
    getRecords();


  const target =
    records.find(
      item =>

          item.id
        ) ===
        String(
          id
        )
    );


  if (

  ) {

  const ok =

        "📍 " +
        (
          target.place ||
          "未命名地點"
        ) +

        "\n" +

        formatRecordTime(
          target
        ),

      confirmText:
        "刪除",

      cancelText:
        "取消",

  ) {

    );

  );

function getEditableDateTimeParts(
  record
) {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone:
          record.timeZone ||
          getCurrentTimeZone(),

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      new Date(
        record.timestamp
      )
    );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );


  return {

    date:

      values.year +
      "-" +
      values.month +
      "-" +
      values.day,

    time:

      values.hour +
      ":" +
      values.minute +
      ":" +
      values.second

  };

}


function localDateTimeToUTC(
  dateText,
  timeText,
  timeZone
) {

  const [
    year,
    month,
    day
  ] =
  dateText
    .split("-")
    .map(Number);


  const [
    hour,
    minute,
    second = 0
  ] =
  timeText
    .split(":")
    .map(Number);


  const guess =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      )
    );


  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      guess
    );


  const values =
    {};


  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );


  const displayed =
    Date.UTC(

      Number(
        values.year
      ),

      Number(
        values.month
      ) - 1,

      Number(
        values.day
      ),

      Number(
        values.hour
      ),

      Number(
        values.minute
      ),

      Number(
        values.second
      )

    );


  const desired =
    Date.UTC(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    );


  return new Date(

    guess.getTime() +

    desired -

    displayed

  );

}


async function saveEditedRecord() {

  const id =
    document
      .getElementById(
        "editRecordId"
      )
      .value;


  const records =
    getRecords();


  const index =
    records.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(
          id
        )
    );


  if (
    index === -1
  ) {

    return;

  }


  const dateText =
    document
      .getElementById(
        "editDate"
      )
      .value;


  const timeText =
    document
      .getElementById(
        "editTime"
      )
      .value;


  if (
    !dateText ||
    !timeText
  ) {

    await showDialog({

      icon:
        "⚠️",

      title:
        "資料不完整",

      message:
        "請輸入日期與時間。",

      showCancel:
        false

    });


    return;

  }


  const record =
    records[
      index
    ];


  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();


  const newDate =
    localDateTimeToUTC(

      dateText,

      timeText,

      timeZone

    );


  record.place =
    document
      .getElementById(
        "editPlace"
      )
      .value
      .trim() ||
    "未命名地點";


  record.note =
    document
      .getElementById(
        "editNote"
      )
      .value
      .trim();


  record.timestamp =
    newDate
      .toISOString();


  record.localTime =
    formatDateTimeForZone(
      newDate,
      timeZone
    );


  records[
    index
  ] =
  record;


  saveRecords(
    records
  );


  closeEditModal();


  updateDateFilterOptions();

  renderRecords();


  showToast(
    "✅ 足跡已修改"
  );

}

  const rows = [[

    "當地日期",

    "當地時間",

    "地點",

    "時區",

    "GMT",

    "UTC時間",

    "緯度",

    "經度",

    "GPS精度",

    "備註",

    "ID"

  ]];


  records
    .sort(
      (
        a,
        b
      ) =>
        new Date(
          a.timestamp
        ) -
        new Date(
          b.timestamp
        )
    )
    .forEach(
      record => {

        rows.push([

          getRecordDateKey(
            record
          ),

          formatRecordTime(
            record
          ),

          record.place,

          record.timeZone ||
          "",

          record.gmtOffset ||
          "",

          record.timestamp,

          record.latitude,

          record.longitude,

          record.accuracy,

          record.note,

          record.id

        ]);

      }
    );


  const csv =

    "\uFEFF" +

    rows
      .map(
        row =>
          row
            .map(
              csvEscape
            )
            .join(",")
      )
      .join("\n");


  downloadFile(

    csv,

    "travel-footprints.csv",

    "text/csv;charset=utf-8"

  );

}


/* =========================================================
   JSON EXPORT
========================================================= */

function exportJSON() {

  const records =
    getRecords();


  if (
    records.length === 0
  ) {

    showToast(
      "目前沒有紀錄"
    );

    return;

  }


  const backup = {

    version:
      4.3,

    exportedAt:
      new Date()
        .toISOString(),

    records:
      records

  };


  downloadFile(

    JSON.stringify(
      backup,
      null,
      2
    ),

    "travel-footprints-v4-3.json",

    "application/json"

  );

}


/* =========================================================
   JSON IMPORT
========================================================= */

function importJSON(
  event
) {

  const file =
    event
      .target
      .files[0];


  if (
    !file
  ) {

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );


        let importedRecords =
          null;


        if (
          Array.isArray(
            data
          )
        ) {

          importedRecords =
            data;

        }

        else if (
          data &&
          Array.isArray(
            data.records
          )
        ) {

          importedRecords =
            data.records;

        }


        if (
          !importedRecords
        ) {

          throw new Error(
            "不是有效的足跡 JSON 備份。"
          );

        }


        const valid =
          importedRecords.every(
            record =>

              record &&

              record.timestamp &&

              record.latitude !==
              undefined &&

              record.longitude !==
              undefined
          );


        if (
          !valid
        ) {

          throw new Error(
            "備份中含有無效紀錄。"
          );

        }


        const normalized =
          normalizeRecordIds(
            importedRecords
          );


        importedRecords =
          normalized.records;


        const ok =
          await showDialog({

            icon:
              "📥",

            title:
              "匯入 JSON 備份",

            message:

              "找到 " +
              importedRecords.length +
              " 筆足跡。\n\n" +

              (
                normalized.changed

                ?

                "已自動修復缺少或重複的 Record ID。\n\n"

                :

                ""
              ) +

              "匯入後會取代目前手機上的所有紀錄。\n\n" +

              "確定要繼續嗎？",

            confirmText:
              "開始匯入",

            cancelText:
              "取消"

          });


        if (
          !ok
        ) {

          return;

        }


        saveRecords(
          importedRecords
        );


        currentDateFilter =
          "all";


        updateDateFilterOptions();

        renderRecords();


        showToast(

          "✅ 已還原 " +

          importedRecords.length +

          " 筆足跡"

        );

      }

      catch (
        error
      ) {

        await showDialog({

          icon:
            "❌",

          title:
            "匯入失敗",

          message:
            error.message,

          showCancel:
            false

        });

      }

      finally {

        event.target.value =
          "";

      }

    };


  reader.readAsText(
    file
  );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(
  content,
  filename,
  type
) {

  const blob =
    new Blob(
      [content],
      {
        type
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  document.body.removeChild(
    a
  );


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   HELPERS
========================================================= */

function csvEscape(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const str =
    String(
      value
    );


  if (
    str.includes(",") ||
    str.includes('"') ||
    str.includes("\n")
  ) {

    return (

      '"' +

      str.replace(
        /"/g,
        '""'
      ) +

      '"'

    );

  }


  return str;

}


function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text ||
    "";


  return div.innerHTML;

}
