<!--
=============================================================
  我的旅遊足跡 V4.2
=============================================================

【V4.2 新增 / 修改功能】

1. 新增「附近 5 個地點」
   - 按下「取得目前 GPS」後
   - 自動使用 OpenStreetMap Overpass API 查詢附近 POI
   - 先查 800 公尺
   - 若不足 5 筆，自動擴大到 1500 公尺
   - 依距離排序
   - 顯示最近 5 個地點

2. 附近地點支援類型
   - amenity
   - shop
   - tourism
   - railway=station
   - railway=halt
   - public_transport
   - leisure
   - office
   - building + name

3. 點選附近地點
   - 自動填入「地點名稱」
   - 保留手動修改能力
   - 不會強制覆蓋使用者最後輸入內容

4. 保留 Nominatim Reverse Geocoding
   - Overpass 查不到附近 POI 時
   - 仍可使用反向地理編碼填入地區名稱

5. 保留 V4.1 修正
   - 自動修復缺少 / 重複 Record ID
   - 地點名稱相同也可建立不同足跡
   - 相同 GPS 也可以共存

6. 保留 V4 功能
   - 自製 Modal
   - Toast
   - 日期篩選
   - Marker ↔ 足跡列表連動
   - 自動時區
   - GMT
   - 每日距離
   - 總移動距離
   - CSV / JSON
   - V2 / V3 / V4 / V4.1 JSON 相容

Storage Key : travelFootprints
Version     : V4.2
=============================================================
-->

<script>

/* =========================================================
   全域
========================================================= */

let currentLat = null;
let currentLng = null;
let currentAccuracy = null;

let currentMarker = null;
let pathLayer = null;
let recordMarkers = [];

let markerByRecordId =
  new Map();

let currentDateFilter =
  "all";

let toastTimer =
  null;

/* =========================================================
   ID
========================================================= */

function generateRecordId() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
    "function"
  ) {

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

/* =========================================================
   修復 ID
========================================================= */

function normalizeRecordIds(
  records
) {

  const usedIds =
    new Set();

  let changed =
    false;

  records.forEach(
    record => {

      let id =
        record.id !== undefined &&
        record.id !== null
          ? String(record.id)
          : "";

      if (
        !id ||
        usedIds.has(id)
      ) {

        record.id =
          generateRecordId();

        id =
          String(
            record.id
          );

        changed =
          true;

      }

      usedIds.add(
        id
      );

    }
  );

  return {
    records,
    changed
  };

}

/* =========================================================
   Toast
========================================================= */

function showToast(
  message,
  duration = 2200
) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      duration
    );

}

/* =========================================================
   Dialog
========================================================= */

function showDialog({

  title =
    "提示",

  message =
    "",

  icon =
    "ℹ️",

  confirmText =
    "確定",

  cancelText =
    "取消",

  showCancel =
    true,

  danger =
    false

}) {

  return new Promise(
    resolve => {

      const modal =
        document.getElementById(
          "dialogModal"

/* =========================================================
   時區
========================================================= */

function getCurrentTimeZone() {

  try {

    return Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone ||
      "UTC";

  }

  catch {

    return "UTC";

  }

}

function getGMTOffset(
  date = new Date()
) {

  const offsetMinutes =
    -date
      .getTimezoneOffset();

  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";

  const absoluteMinutes =
    Math.abs(
      offsetMinutes
    );

  const hours =
    Math.floor(
      absoluteMinutes / 60
    );

  const minutes =
    absoluteMinutes % 60;

  if (
    minutes === 0
  ) {

    return (
      "GMT" +
      sign +
      hours
    );

  }

  return (
    "GMT" +
    sign +
    hours +
    ":" +
    String(minutes)
      .padStart(2,"0")
  );

}

function getUTCOffsetMinutes() {

  return (
    -new Date()
      .getTimezoneOffset()
  );

}

function getCurrentLocation() {

  const status =
    document.getElementById(
      "gpsStatus"
    );

  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "❌ 此瀏覽器不支援 GPS 定位。";

    return;

  }

  status.textContent =
    "📡 正在取得 GPS 位置...";

  navigator
    .geolocation
    .getCurrentPosition(

      async function(position) {

        currentLat =
          position.coords.latitude;

        currentLng =
          position.coords.longitude;

        currentAccuracy =
          position.coords.accuracy;

        document
          .getElementById(
            "lat"
          )
          .textContent =
          currentLat.toFixed(6);

        document
          .getElementById(
            "lng"
          )
          .textContent =
          currentLng.toFixed(6);

        document
          .getElementById(
            "accuracy"
          )
          .textContent =
          "±" +
          Math.round(
            currentAccuracy
          ) +
          " 公尺";

        status.textContent =
          "✅ GPS 定位成功";

        if (
          currentMarker
        ) {

          map.removeLayer(
            currentMarker
          );

        }

        currentMarker =
          L.marker(
            [
              currentLat,
              currentLng
            ]
          )
          .addTo(map)
          .bindPopup(
            "📍 目前位置"
          )
          .openPopup();

        map.setView(
          [
            currentLat,
            currentLng
          ],
          16
        );

        /* V4.2：先查附近 5 個地點 */

        await loadNearbyPlaces(
          currentLat,
          currentLng
        );

      },

      function(error) {

        console.error(
          error
        );

        switch (
          error.code
        ) {

          case error.PERMISSION_DENIED:

            status.textContent =
              "❌ 定位權限被拒絕。";

            break;

          case error.POSITION_UNAVAILABLE:

            status.textContent =
              "❌ 無法取得目前位置。";

            break;

          case error.TIMEOUT:

            status.textContent =
              "❌ GPS 定位逾時。";

            break;

          default:

            status.textContent =
              "❌ GPS 定位失敗。";

        }

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          0

      }

    );

}

/* =========================================================
   V4.2 新增：Overpass API
========================================================= */

async function fetchNearbyPlaces(
  lat,
  lng,
  radius
) {

  const query = `
[out:json][timeout:15];

(
  node(around:${radius},${lat},${lng})["name"]["amenity"];
  way(around:${radius},${lat},${lng})["name"]["amenity"];
  relation(around:${radius},${lat},${lng})["name"]["amenity"];

  node(around:${radius},${lat},${lng})["name"]["shop"];
  way(around:${radius},${lat},${lng})["name"]["shop"];
  relation(around:${radius},${lat},${lng})["name"]["shop"];

  node(around:${radius},${lat},${lng})["name"]["tourism"];
  way(around:${radius},${lat},${lng})["name"]["tourism"];
  relation(around:${radius},${lat},${lng})["name"]["tourism"];

  node(around:${radius},${lat},${lng})["name"]["railway"="station"];
  node(around:${radius},${lat},${lng})["name"]["railway"="halt"];

  node(around:${radius},${lat},${lng})["name"]["public_transport"];
  way(around:${radius},${lat},${lng})["name"]["public_transport"];

  node(around:${radius},${lat},${lng})["name"]["leisure"];
  way(around:${radius},${lat},${lng})["name"]["leisure"];

  node(around:${radius},${lat},${lng})["name"]["office"];
  way(around:${radius},${lat},${lng})["name"]["office"];

  node(around:${radius},${lat},${lng})["name"]["building"];
  way(around:${radius},${lat},${lng})["name"]["building"];
);

out center tags;
`;

  const response =
    await fetch(
      "https://overpass-api.de/api/interpreter",
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"

        },

        body:
          "data=" +
          encodeURIComponent(
            query
          )

      }
    );

  if (
    !response.ok
  ) {

    throw new Error(
      "Overpass HTTP " +
      response.status
    );

  }

  const data =
    await response.json();

  const seen =
    new Set();

  const places =
    [];

  data.elements.forEach(
    element => {

      const name =
        element.tags &&
        element.tags.name
          ? element.tags.name.trim()
          : "";

      if (
        !name
      ) {

        return;

      }

      const pLat =
        element.lat ??
        element.center?.lat;

      const pLng =
        element.lon ??
        element.center?.lon;

      if (
        pLat === undefined ||
        pLng === undefined
      ) {

        return;

      }

      const key =
        name +
        "|" +
        Number(pLat).toFixed(5) +
        "|" +
        Number(pLng).toFixed(5);

      if (
        seen.has(key)
      ) {

        return;

      }

      seen.add(
        key
      );

      const distanceKm =
        calculateDistanceKm(
          lat,
          lng,
          Number(pLat),
          Number(pLng)
        );

      places.push({

        name:
          name,

        lat:
          Number(pLat),

        lng:
          Number(pLng),

        distanceKm:
          distanceKm,

        category:
          detectPoiCategory(
            element.tags ||
            {}
          )

      });

    }
  );

  places.sort(
    (
      a,
      b
    ) =>
      a.distanceKm -
      b.distanceKm
  );

  return places;

}

/* =========================================================
   Distance
========================================================= */

function calculateDistanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const toRad =
    value =>
      value *
      Math.PI /
      180;

  const dLat =
    toRad(
      lat2 -
      lat1
    );

  const dLon =
    toRad(
      lon2 -
      lon1
    );

  const a =

    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;

  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );

  return (
    R *
    c
  );

}

function calculateGroupDistance(
  records
) {

  let total =
    0;

  for (
    let i = 1;
    i < records.length;
    i++
  ) {

    total +=
      calculateDistanceKm(

        Number(
          records[i - 1].latitude
        ),

        Number(
          records[i - 1].longitude
        ),

        Number(
          records[i].latitude
        ),

        Number(
          records[i].longitude
        )

      );

  }

  return total;

}

function formatDistance(
  km
) {

  if (
    km < 1
  ) {

    return (
      Math.round(
        km *
        1000
      ) +
      " m"
    );

  }

  if (
    km < 10
  ) {

    return (
      km.toFixed(2) +
      " km"
    );

  }

  return (
    km.toFixed(1) +
    " km"
  );

}

/* =========================================================
   Duplicate
========================================================= */

function checkDuplicateRecord(
  newLat,
  newLng,
  newTime
) {

  const records =
    getRecords();

  if (
    records.length === 0
  ) {

    return false;

  }

  const sorted =
    [...records]
      .sort(
        (
          a,
          b
        ) =>
          new Date(
            a.timestamp
          ) -
          new Date(
            b.timestamp
          )
      );

  const last =
    sorted[
      sorted.length - 1
    ];

  const lastTime =
    new Date(
      last.timestamp
    );

  const seconds =
    Math.abs(
      newTime -
      lastTime
    ) /
    1000;

  const meters =
    calculateDistanceKm(

      Number(
        last.latitude
      ),

      Number(
        last.longitude
      ),

      Number(
        newLat
      ),

      Number(
        newLng
      )

    ) *
    1000;

  if (
    seconds <= 60 &&
    meters <= 30
  ) {

    return {

      record:
        last,

      seconds:
        Math.round(
          seconds
        ),

      meters:
        Math.round(
          meters
        )

    };

  }

  return false;

}

async function saveLocation() {

  if (
    currentLat === null ||
    currentLng === null
  ) {

    await showDialog({

      icon:
        "📍",

      title:
        "尚未定位",

      message:
        "請先按「取得目前 GPS」。",

      showCancel:
        false

    });

    return;

  }

  const placeName =
    document
      .getElementById(
        "placeName"
      )
      .value
      .trim();

  const note =
    document
      .getElementById(
        "note"
      )
      .value
      .trim();

  const recordTime =
    new Date();

  const duplicate =
    checkDuplicateRecord(

      currentLat,

      currentLng,

      recordTime

    );

  if (
    duplicate
  ) {

    const ok =
      await showDialog({

        icon:
          "⚠️",

        title:
          "可能是重複紀錄",

        message:

          "上一筆：" +
          (
            duplicate.record.place ||
            "未命名地點"
          ) +

          "\n時間相差：" +
          duplicate.seconds +
          " 秒" +

          "\n距離：約 " +
          duplicate.meters +
          " 公尺" +

          "\n\n仍然要新增嗎？",

        confirmText:
          "仍然新增",

        cancelText:
          "取消"

      });

    if (
      !ok
    ) {

      return;

    }

  }

  const timeZone =
    getCurrentTimeZone();

  const record = {

    id:
      generateRecordId(),

    latitude:
      currentLat,

    longitude:
      currentLng,

    accuracy:
      currentAccuracy,

    place:
      placeName ||
      "未命名地點",

    note:
      note,

    timestamp:
      recordTime
        .toISOString(),

    timeZone:
      timeZone,

    gmtOffset:
      getGMTOffset(
        recordTime
      ),

    utcOffsetMinutes:
      getUTCOffsetMinutes(),

    localTime:
      formatDateTimeForZone(
        recordTime,
        timeZone
      )

  };

  const records =
    getRecords();

  records.push(
    record
  );

  saveRecords(
    records
  );

  document
    .getElementById(
      "note"
    )
    .value =
    "";

  updateDateFilterOptions();

  renderRecords();

  showToast(
    "✅ 已紀錄：" +
    record.place
  );

}

function formatDateTimeForZone(
  date,
  timeZone
) {

  try {

    return date
      .toLocaleString(
        "zh-TW",
        {

          timeZone,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }
      );

  }

  catch {

    return date
      .toLocaleString(
        "zh-TW"
      );

  }

}

function formatRecordTime(
  record
) {

  const date =
    new Date(
      record.timestamp
    );

  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();

  return date
    .toLocaleTimeString(
      "zh-TW",
      {

        timeZone,

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false

      }
    );

}

function getRecordDateKey(
  record
) {

  const date =
    new Date(
      record.timestamp
    );

  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"

      }
    )
    .formatToParts(
      date
    );

  const values =
    {};

  parts.forEach(
    part => {

      values[
        part.type
      ] =
      part.value;

    }
  );

  return (
    values.year +
    "-" +
    values.month +
    "-" +
    values.day
  );

}

function formatDayTitle(
  record
) {

  return new Date(
    record.timestamp
  )
  .toLocaleDateString(
    "zh-TW",
    {

      timeZone:
        record.timeZone ||
        getCurrentTimeZone(),

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      weekday:
        "long"

    }
  );

}

/* =========================================================
   Group
========================================================= */

function groupRecordsByDay(
  records
) {

  const groups =
    {};

  records.forEach(
    record => {

      const key =
        getRecordDateKey(
          record
        );

      if (
        !groups[key]
      ) {

        groups[key] =
          [];

      }

      groups[key]
        .push(
          record
        );

    }
  );

  return groups;

}

/* =========================================================
   Date Filter
========================================================= */

function updateDateFilterOptions() {

  const select =
    document.getElementById(
      "dateFilter"
    );

  const records =
    getRecords();

  const keys =
    [...new Set(

      records.map(
        getRecordDateKey
      )

    )]
    .sort()
    .reverse();

  select.innerHTML =
    '<option value="all">全部日期</option>';

  keys.forEach(
    key => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        key;

      option.textContent =
        key.replaceAll(
          "-",
          "/"
        );

      select.appendChild(
        option
      );

    }
  );

  if (
    currentDateFilter !==
    "all" &&
    keys.includes(
      currentDateFilter
    )
  ) {

    select.value =
      currentDateFilter;

  }

  else {

    currentDateFilter =
      "all";

    select.value =
      "all";

  }

}

function changeDateFilter() {

  currentDateFilter =
    document
      .getElementById(
        "dateFilter"
      )
      .value;

  renderRecords();

}

/* =========================================================
   Marker ↔ Record
========================================================= */

function scrollToRecord(
  id
) {

  const target =
    document.querySelector(
      `.record[data-record-id="${CSS.escape(String(id))}"]`
    );

  if (
    !target
  ) {

    return;

  }

  target.scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });

  target.classList.add(
    "record-highlight"
  );

  setTimeout(
    () => {

      target
        .classList
        .remove(
          "record-highlight"
        );

    },
    1800
  );

}

function focusRecordOnMap(
  id
) {

  const marker =
    markerByRecordId.get(
      String(id)
    );

  if (
    !marker
  ) {

    return;

  }

  map.setView(
    marker.getLatLng(),
    16
  );

  marker.openPopup();

}

/* =========================================================
   Render
========================================================= */

function renderRecords() {

  const allRecords =
    getRecords()
      .sort(
        (
          a,
          b
        ) =>
          new Date(
            a.timestamp
          ) -
          new Date(
            b.timestamp
          )
      );

  updateStats(
    allRecords
  );

  const list =
    document.getElementById(
      "recordList"
    );

  list.innerHTML =
    "";

  recordMarkers.forEach(
    marker =>
      map.removeLayer(
        marker
      )
  );

  recordMarkers =
    [];

  markerByRecordId.clear();

  if (
    pathLayer
  ) {

    map.removeLayer(
      pathLayer
    );

    pathLayer =
      null;

  }

  let displayRecords =
    allRecords;

  if (
    currentDateFilter !==
    "all"
  ) {

    displayRecords =
      allRecords.filter(
        record =>
          getRecordDateKey(
            record
          ) ===
          currentDateFilter
      );

  }

  if (
    displayRecords.length ===
    0
  ) {

    list.innerHTML =
      '<div class="empty">此日期沒有足跡</div>';

    return;

  }

  const groups =
    groupRecordsByDay(
      displayRecords
    );

  const dateKeys =
    Object
      .keys(
        groups
      )
      .sort();

  const path =
    [];

  let markerIndex =
    1;

  dateKeys.forEach(
    dateKey => {

      const dayRecords =
        groups[
          dateKey
        ];

      const dayDistance =
        calculateGroupDistance(
          dayRecords
        );

      const dayGroup =
        document.createElement(
          "div"
        );

      dayGroup.className =
        "day-group";

      const header =
        document.createElement(
          "div"
        );

      header.className =
        "day-header";

      header.innerHTML = `

        <div class="day-title">
          📅
          ${escapeHTML(
            formatDayTitle(
              dayRecords[0]
            )
          )}
        </div>

        <div class="day-summary">
          📍
          ${dayRecords.length}
          個足跡
          ・
          🚗
          移動約
          ${formatDistance(
            dayDistance
          )}
        </div>

      `;

      dayGroup.appendChild(
        header
      );

      dayRecords.forEach(
        (
          record,
          index
        ) => {

          let distanceText =
            "";

          if (
            index > 0
          ) {

            distanceText =
              formatDistance(

                calculateDistanceKm(

                  Number(
                    dayRecords[index - 1]
                      .latitude
                  ),

                  Number(
                    dayRecords[index - 1]
                      .longitude
                  ),

                  Number(
                    record.latitude
                  ),

                  Number(
                    record.longitude
                  )

                )

              );

          }

          const zone =
            record.timeZone ||
            "舊版紀錄";

          const timezoneText =
            record.gmtOffset
              ? zone +
                " · " +
                record.gmtOffset
              : zone;

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "record";

          div.dataset.recordId =
            String(
              record.id
            );

          div.innerHTML = `

            <div class="record-top">

              <div
                class="record-main"
                onclick="
                  focusRecordOnMap(
                    '${String(record.id)}'
                  )
                "
              >

                <div class="record-time">
                  ${formatRecordTime(
                    record
                  )}
                </div>

                <div class="record-place">
                  📍
                  ${escapeHTML(
                    record.place
                  )}
                </div>

              </div>

              <div class="record-actions">

                <button
                  class="edit-btn"
                  onclick="
                    event.stopPropagation();
                    openEditModal(
                      '${String(record.id)}'
                    );
                  "
                >
                  ✏️ 編輯
                </button>

                <button
                  class="delete-btn"
                  onclick="
                    event.stopPropagation();
                    deleteRecord(
                      '${String(record.id)}'
                    );
                  "
                >
                  🗑️ 刪除
                </button>

              </div>

            </div>

            <div
              class="record-detail"
              onclick="
                focusRecordOnMap(
                  '${String(record.id)}'
                )
              "
            >

              GPS：
              ${Number(
                record.latitude
              ).toFixed(6)},
              ${Number(
                record.longitude
              ).toFixed(6)}

              <br>

              精度：
              ±${Math.round(
                record.accuracy ||
                0
              )}
              公尺

              <br>

              <span
                class="record-timezone"
              >
                🕐
                ${escapeHTML(
                  timezoneText
                )}
              </span>

              ${
                distanceText
                ?
                `
                <span
                  class="record-distance"
                >
                  ↗ 前一站
                  ${distanceText}
                </span>
                `
                :
                ""
              }

            </div>

            ${
              record.note
              ?
              `
              <div class="record-note">
                📝
                ${escapeHTML(
                  record.note
                )}
              </div>
              `
              :
              ""
            }

          `;

          dayGroup.appendChild(
            div
          );

          const marker =
            L.marker(
              [
                Number(
                  record.latitude
                ),
                Number(
                  record.longitude
                )
              ]
            )
            .addTo(
              map
            )
            .bindPopup(

              `
              <b>
                ${markerIndex}.
                ${escapeHTML(
                  record.place
                )}
              </b>
              <br>
              ${dateKey}
              ${formatRecordTime(
                record
              )}
              <br>
              🕐
              ${escapeHTML(
                timezoneText
              )}
              `

            );

          marker.on(
            "click",
            () => {

              scrollToRecord(
                record.id
              );

            }
          );

          recordMarkers.push(
            marker
          );

          markerByRecordId.set(
            String(
              record.id
            ),
            marker
          );

          path.push(
            [
              Number(
                record.latitude
              ),
              Number(
                record.longitude
              )
            ]
          );

          markerIndex++;

        }
      );

      list.appendChild(
        dayGroup
      );

    }
  );

  if (
    path.length >= 2
  ) {

    pathLayer =
      L.polyline(
        path,
        {
          weight: 4,
          opacity: 0.7
        }
      )
      .addTo(
        map
      );

  }

  if (
    path.length > 0
  ) {

    map.fitBounds(
      L.latLngBounds(
        path
      ),
      {
        padding:
          [30,30],
        maxZoom:
          16
      }
    );

  }

}

/* =========================================================
   Stats
========================================================= */

function updateStats(
  records
) {

  document
    .getElementById(
      "recordCount"
    )
    .textContent =
    records.length;

  const groups =
    groupRecordsByDay(
      records
    );

  document
    .getElementById(
      "dayCount"
    )
    .textContent =
    Object.keys(
      groups
    )
    .length;

  let total =
    0;

  Object.values(
    groups
  )
  .forEach(
    day =>
      total +=
        calculateGroupDistance(
          day
        )
  );

  document
    .getElementById(
      "totalDistance"
    )
    .textContent =
    formatDistance(
      total
    );

}

function getEditableDateTimeParts(
  record
) {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {

        timeZone:
          record.timeZone ||
          getCurrentTimeZone(),

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      new Date(
        record.timestamp
      )
    );

  const values =
    {};

  parts.forEach(
    part =>
      values[
        part.type
      ] =
      part.value
  );

  return {

    date:

      values.year +
      "-" +
      values.month +
      "-" +
      values.day,

    time:

      values.hour +
      ":" +
      values.minute +
      ":" +
      values.second

  };

}

function localDateTimeToUTC(
  dateText,
  timeText,
  timeZone
) {

  const [
    year,
    month,
    day
  ] =
  dateText
    .split("-")
    .map(Number);

  const [
    hour,
    minute,
    second = 0
  ] =
  timeText
    .split(":")
    .map(Number);

  const guess =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      )
    );

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {

        timeZone,

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    )
    .formatToParts(
      guess
    );

  const values =
    {};

  parts.forEach(
    part =>
      values[
        part.type
      ] =
      part.value
  );

  const displayed =
    Date.UTC(

      Number(
        values.year
      ),

      Number(
        values.month
      ) - 1,

      Number(
        values.day
      ),

      Number(
        values.hour
      ),

      Number(
        values.minute
      ),

      Number(
        values.second
      )

    );

  const desired =
    Date.UTC(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    );

  return new Date(

    guess.getTime() +

    desired -

    displayed

  );

}

async function saveEditedRecord() {

  const id =
    document
      .getElementById(
        "editRecordId"
      )
      .value;

  const records =
    getRecords();

  const index =
    records.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(
          id
        )
    );

  if (
    index === -1
  ) {

    return;

  }

  const dateText =
    document
      .getElementById(
        "editDate"
      )
      .value;

  const timeText =
    document
      .getElementById(
        "editTime"
      )
      .value;

  if (
    !dateText ||
    !timeText
  ) {

    await showDialog({

      icon:
        "⚠️",

      title:
        "資料不完整",

      message:
        "請輸入日期與時間。",

      showCancel:
        false

    });

    return;

  }

  const record =
    records[
      index
    ];

  const timeZone =
    record.timeZone ||
    getCurrentTimeZone();

  const newDate =
    localDateTimeToUTC(

      dateText,

      timeText,

      timeZone

    );

  record.place =
    document
      .getElementById(
        "editPlace"
      )
      .value
      .trim() ||
    "未命名地點";

  record.note =
    document
      .getElementById(
        "editNote"
      )
      .value
      .trim();

  record.timestamp =
    newDate
      .toISOString();

  record.localTime =
    formatDateTimeForZone(
      newDate,
      timeZone
    );

  records[
    index
  ] =
  record;

  saveRecords(
    records
  );

  closeEditModal();

  updateDateFilterOptions();

  renderRecords();

  showToast(
    "✅ 足跡已修改"
  );

}

  ) {

    );

  }

    "時區",

    "GMT",

    "UTC時間",

    "緯度",

    "經度",

    "備註",

    "ID"

  ]];

    .sort(
      (

      ) =>

          a.timestamp
        ) -
        new Date(
          b.timestamp
        )
    )

          ),

/* =========================================================
   JSON Import
========================================================= */

function importJSON(
  event
) {

  const file =
    event
      .target
      .files[0];

  if (
    !file
  ) {

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    async function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );

        let importedRecords =
          null;

        if (
          Array.isArray(
            data
          )
        ) {

          importedRecords =
            data;

        }

        else if (
          data &&
          Array.isArray(
            data.records
          )
        ) {

          importedRecords =
            data.records;

        }

        if (
          !importedRecords
        ) {

          throw new Error(
            "不是有效的足跡 JSON 備份。"
          );

        }

        const valid =
          importedRecords.every(
            record =>

              record &&
              record.timestamp &&
              record.latitude !==
              undefined &&
              record.longitude !==
              undefined
          );

        if (
          !valid
        ) {

          throw new Error(
            "備份中含有無效紀錄。"
          );

        }

        const normalized =
          normalizeRecordIds(
            importedRecords
          );

        importedRecords =
          normalized.records;

        const ok =
          await showDialog({

            icon:
              "📥",

            title:
              "匯入 JSON 備份",

            message:

              "找到 " +
              importedRecords.length +
              " 筆足跡。\n\n" +

              (
                normalized.changed
                ?
                "已自動修復缺少或重複的 Record ID。\n\n"
                :
                ""
              ) +

              "匯入後會取代目前手機上的所有紀錄。\n\n" +

              "確定要繼續嗎？",

            confirmText:
              "開始匯入",

            cancelText:
              "取消"

          });

        if (
          !ok
        ) {

          return;

        }

        saveRecords(
          importedRecords
        );

        currentDateFilter =
          "all";

        updateDateFilterOptions();

        renderRecords();

        showToast(
          "✅ 已還原 " +
          importedRecords.length +
          " 筆足跡"
        );

      }

      catch (
        error
      ) {

        await showDialog({

          icon:
            "❌",

          title:
            "匯入失敗",

          message:
            error.message,

          showCancel:
            false

        });

      }

      finally {

        event.target.value =
          "";

      }

    };

  reader.readAsText(
    file
  );

}

/* =========================================================
   Download
========================================================= */

function downloadFile(
  content,
  filename,
  type
) {

  const blob =
    new Blob(
      [content],
      {
        type
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body
    .appendChild(
      a
    );

  a.click();

  document.body
    .removeChild(
      a
    );

  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}

/* =========================================================
   Helpers
========================================================= */

function csvEscape(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  const str =
    String(
      value
    );

  if (
    str.includes(",") ||
    str.includes('"') ||
    str.includes("\n")
  ) {

    return (
      '"' +
      str.replace(
        /"/g,
        '""'
      ) +
      '"'
    );

  }

  return str;

}

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text ||
    "";

  return div.innerHTML;

}

  );
